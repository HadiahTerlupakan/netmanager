services:
  db:
    image: postgres:16
    container_name: netmanager-postgres-app
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netmgr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netmgr}
      POSTGRES_DB: ${POSTGRES_DB:-netmanager}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - netmanager-network


  db_radius:
    image: postgres:16
    container_name: netmanager-postgres-radius
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netmgr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netmgr}
      POSTGRES_DB: ${POSTGRES_DB_RADIUS:-radius}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
    ports:
      - "5433:5432"
    volumes:
      - db_radius_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - netmanager-network

  db_billing:
    image: postgres:16
    container_name: netmanager-postgres-billing
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netmgr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netmgr}
      POSTGRES_DB: ${POSTGRES_DB_BILLING:-billing}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
    ports:
      - "5434:5432"
    volumes:
      - db_billing_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - netmanager-network

  db_mitra:
    image: postgres:16
    container_name: netmanager-postgres-mitra
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netmgr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netmgr}
      POSTGRES_DB: ${POSTGRES_DB_MITRA:-mitra}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
    ports:
      - "5435:5432"
    volumes:
      - db_mitra_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - netmanager-network

  redis:
    image: redis:7-alpine
    container_name: netmanager-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}" ]
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - netmanager-network

  freeradius:
    build:
      context: .
      dockerfile: radius/Dockerfile
    image: netmanager-radius:local
    container_name: netmanager-freeradius
    restart: unless-stopped
    depends_on:
      - db_radius
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    environment:
      - DB_TYPE=postgresql
      - DB_HOST=db_radius
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB_RADIUS:-radius}
      - DB_USER=${POSTGRES_USER:-netmgr}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-netmgr}
      - RADIUS_SECRET=${RADIUS_SECRET:-testing123}
      - DEBUG=${RADIUS_DEBUG:-false}
    volumes:
      - radius_logs:/var/log/freeradius
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - netmanager-network

volumes:
  db_data:
    driver: local
  db_radius_data:
    driver: local
  db_billing_data:
    driver: local
  db_mitra_data:
    driver: local
  redis_data:
    driver: local
  radius_logs:
    driver: local

networks:
  netmanager-network:
    driver: bridge
