version: "3.9"

services:
  db:
    image: postgres:16
    container_name: netmanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netmgr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netmgr}
      POSTGRES_DB: ${POSTGRES_DB:-netmanager}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: netmanager-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  freeradius:
    image: freeradius/freeradius-server:3.2.5
    container_name: netmanager-freeradius
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "1812:1812/udp"  # Authentication
      - "1813:1813/udp"  # Accounting
    environment:
      - DB_TYPE=postgresql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-netmanager}
      - DB_USER=${POSTGRES_USER:-netmgr}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-netmgr}
      - RADIUS_SECRET=${RADIUS_SECRET:-testing123}
    volumes:
      - radius_logs:/var/log/freeradius

volumes:
  db_data:
  redis_data:
  radius_logs:


