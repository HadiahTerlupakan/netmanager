name: Deploy Production

# Menggantikan Jenkins. Perbedaan pokoknya: build berjalan di VPS Gitea, bukan
# sebagai pod di cluster produksi. Build Next.js pernah menembus 21 GB dan
# menjatuhkan seluruh host produksi ketika keduanya berbagi mesin.
#
# Deploy dilakukan lewat SSH ke host produksi, bukan dengan membuka API
# Kubernetes ke internet: yang menyeberang hanya perintah kubectl yang ringan,
# sedangkan port 6443 tetap tertutup dari luar.

on:
  push:
    branches: [main]
    # Commit yang hanya menyentuh dokumentasi tidak mengubah apa pun yang
    # dibangun atau dijalankan, jadi tidak perlu membakar satu siklus deploy
    # ~40 menit. Run tetap jalan begitu ada satu berkas lain yang berubah,
    # termasuk ketika changelog ikut dalam commit yang mengubah kode.
    paths-ignore:
      - "docs/**"
      - "tasks/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      allow_migration_without_backup:
        description: >-
          Lanjutkan migrasi meskipun cadangan pra-migrasi gagal. Hanya untuk
          keadaan darurat yang disengaja; pemakaiannya tercatat pada run ini.
          Deploy otomatis dari push tidak bisa mengisi input ini, jadi tidak
          pernah melewati cadangan diam-diam.
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NAMESPACE: netmanager-production
  K8S_DIR: k8s/production
  APP_IMAGE_NAME: netmanager-app
  CRON_IMAGE_NAME: netmanager-cron
  RADIUS_IMAGE_NAME: netmanager-radius
  DOCKER_BUILDKIT: "1"
  # Container job berada di jaringan gitea_giteanet, sehingga instance Gitea
  # terjangkau lewat nama servicenya. Ini juga URL yang dipakai
  # actions/checkout sebelum diganti.
  REPO_CLONE_URL: http://gitea:3000/${{ github.repository }}.git

jobs:
  quality:
    runs-on: netmanager-ci
    steps:
      # Dua deploy berturut-turut mati di langkah SSH pertama — sekali karena
      # DEPLOY_SSH_TARGET masih menunjuk IP server lama, sekali karena nama
      # secret tersalin ke kolom nilainya. Keduanya baru ketahuan setelah
      # build 23-65 menit selesai, padahal penyebabnya terbaca dalam hitungan
      # detik. Secret diperiksa di sini, sebelum apa pun dibangun.
      #
      # DEPLOY_SSH_KEY sengaja tidak ikut diperiksa: menariknya ke job ini
      # berarti kunci privat produksi ikut hadir di environment yang menjalankan
      # lint, typecheck, dan tes. Kunci itu tetap terkurung di job deploy.
      #
      # Nilai secret tidak pernah dicetak — yang dilaporkan hanya lolos/gagal.
      - name: Periksa secret deploy
        env:
          SSH_TARGET: ${{ secrets.DEPLOY_SSH_TARGET }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          gagal() {
            echo "::error::$1"
            exit 1
          }

          [ -n "${SSH_TARGET}" ] || gagal "DEPLOY_SSH_TARGET kosong"
          [ -n "${KNOWN_HOSTS}" ] || gagal "DEPLOY_KNOWN_HOSTS kosong"

          # Menangkap nama secret yang tersalin ke kolom nilai: teks polos
          # tanpa '@' tidak akan pernah jadi tujuan SSH yang sah.
          case "${SSH_TARGET}" in
            *@*) ;;
            *) gagal "DEPLOY_SSH_TARGET tidak berbentuk user@host" ;;
          esac

          host="${SSH_TARGET##*@}"
          user="${SSH_TARGET%@*}"
          [ -n "${host}" ] || gagal "DEPLOY_SSH_TARGET tidak punya bagian host"
          [ -n "${user}" ] || gagal "DEPLOY_SSH_TARGET tidak punya bagian user"

          # known_hosts yang tidak memuat host tujuan membuat SSH dengan
          # BatchMode gagal di verifikasi host key, bukan di koneksi.
          printf '%s\n' "${KNOWN_HOSTS}" | grep -qF "${host}" \
            || gagal "DEPLOY_KNOWN_HOSTS tidak memuat entri untuk host tujuan"

          # Menangkap alamat basi: host lama menggantung sampai TCP timeout.
          timeout 10 bash -c "cat < /dev/null > /dev/tcp/${host}/22" 2>/dev/null \
            || gagal "Host tujuan tidak menjawab di port 22"

          echo "Secret deploy lolos pemeriksaan"

      # actions/checkout diunduh dari github.com setiap job, dan dari mesin ini
      # github.com sering i/o timeout sementara transfer besarnya ~4 KB/s.
      # Repositorinya sendiri ada di Gitea lokal, jadi kode diambil langsung
      # dari sana tanpa perantara mana pun.
      - name: Ambil kode dari Gitea
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${REPO_CLONE_URL}"
          # Token ditaruh di config lokal, bukan di argumen perintah, supaya
          # tidak terbaca lewat daftar proses.
          git config --local http.extraheader \
            "Authorization: basic $(printf 'x-access-token:%s' '${{ github.token }}' | base64 -w0)"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          git config --local --unset-all http.extraheader

      - name: Pasang dependensi
        env:
          # Prisma butuh URL berbentuk sah saat generate, bukan koneksi nyata.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          RADIUS_DATABASE_URL: postgresql://user:pass@localhost:5432/radius
          DATABASE_URL_BILLING: postgresql://user:pass@localhost:5432/billing
          DATABASE_URL_MITRA: postgresql://user:pass@localhost:5432/mitra
        run: |
          set -euo pipefail
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          # fetch-retries hanya mengulang permintaan individual; ECONNRESET di
          # tengah aliran tetap membatalkan seluruh `npm ci`. Jaringan mesin ini
          # sudah terbukti tidak selalu mulus, jadi perintahnya sendiri diulang.
          for percobaan in 1 2 3; do
            if npm ci --no-audit --prefer-offline --ignore-scripts; then
              break
            fi
            if [ "$percobaan" = 3 ]; then
              echo "npm ci gagal setelah 3 percobaan" >&2
              exit 1
            fi
            echo "npm ci gagal (percobaan $percobaan), mengulang dalam 15 detik" >&2
            sleep 15
          done
          npm run prisma:generate

      - name: Lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run lint

      - name: Typecheck
        # Build Jenkins #316 gagal persis di sini karena berkas tes ditambah
        # tanpa typecheck ulang. Tahap ini sengaja dipisah agar penyebabnya
        # langsung terbaca dari nama step yang merah.
        #
        # Batas heap dipasang di bawah batas container: Node yang memakai
        # default lebih besar akan abort (exit 134) alih-alih memicu GC.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run typecheck

      - name: Tes unit
        env:
          NODE_ENV: test
          NODE_OPTIONS: --max-old-space-size=4096
          NEXTAUTH_SECRET: ci-build-dummy-secret-at-least-32-chars
          AUTH_SECRET: ci-build-dummy-secret-at-least-32-chars
          NEXTAUTH_URL: http://localhost:3000
          ENABLE_INTERNAL_CRON: "false"
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          RADIUS_DATABASE_URL: postgresql://user:pass@localhost:5432/radius
          DATABASE_URL_BILLING: postgresql://user:pass@localhost:5432/billing
          DATABASE_URL_MITRA: postgresql://user:pass@localhost:5432/mitra
          REDIS_URL: redis://localhost:6379
        run: npx vitest run --maxWorkers=2

  build:
    needs: quality
    runs-on: netmanager-ci
    outputs:
      app_image: ${{ steps.refs.outputs.app_image }}
      cron_image: ${{ steps.refs.outputs.cron_image }}
      radius_image: ${{ steps.refs.outputs.radius_image }}
    steps:
      # actions/checkout diunduh dari github.com setiap job, dan dari mesin ini
      # github.com sering i/o timeout sementara transfer besarnya ~4 KB/s.
      # Repositorinya sendiri ada di Gitea lokal, jadi kode diambil langsung
      # dari sana tanpa perantara mana pun.
      - name: Ambil kode dari Gitea
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${REPO_CLONE_URL}"
          # Token ditaruh di config lokal, bukan di argumen perintah, supaya
          # tidak terbaca lewat daftar proses.
          git config --local http.extraheader \
            "Authorization: basic $(printf 'x-access-token:%s' '${{ github.token }}' | base64 -w0)"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          git config --local --unset-all http.extraheader

      - name: Susun referensi image
        id: refs
        run: |
          set -euo pipefail
          # Tag immutable: 12 karakter commit + nomor run, sama seperti Jenkins.
          VERSION="$(echo "${GITHUB_SHA}" | cut -c1-12)-${GITHUB_RUN_NUMBER}"
          BASE="${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_NAMESPACE }}"
          {
            echo "app_image=${BASE}/${APP_IMAGE_NAME}:${VERSION}"
            echo "cron_image=${BASE}/${CRON_IMAGE_NAME}:${VERSION}"
            echo "radius_image=${BASE}/${RADIUS_IMAGE_NAME}:${VERSION}"
            echo "cache_base=${BASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Masuk ke registry
        run: |
          set -euo pipefail
          echo "${{ secrets.REGISTRY_PASSWORD }}" \
            | docker login "${{ secrets.REGISTRY_URL }}" \
                -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Siapkan secret build
        run: |
          set -euo pipefail
          # Nilai dummy: hanya dibutuhkan agar build tidak gagal memvalidasi env.
          # Nilai sungguhan disuntik saat runtime lewat secret Kubernetes.
          mkdir -p .secrets && chmod 700 .secrets
          printf '%s' 'ci-build-dummy-secret-at-least-32-chars' > .secrets/nextauth_secret.txt
          printf '%s' 'ci-build-dummy-secret-at-least-32-chars' > .secrets/auth_secret.txt
          printf '%s' 'ci-build-dummy-secret-at-least-32-chars' > .secrets/oauth_key.txt

      # Build memakai BuildKit bawaan dockerd, bukan buildx dengan driver
      # docker-container. Builder terpisah itu punya cgroup, content store, dan
      # page cache sendiri, sehingga base image tersimpan dua kali dan build
      # berdesakan dalam plafon memorinya sendiri meski host masih lapang. Ia
      # juga meninggalkan proses `next build` hidup ketika `timeout` memotong
      # klien — satu sisa pernah menahan 8,9 GB selama hampir dua jam.
      #
      # Cache registry juga tidak dipakai: egress ghcr.io dari mesin ini hanya
      # ~4 KB/s, sehingga impor cache menggantung lebih lama daripada membangun
      # ulang. Runner ini menetap, jadi cache build dockerd bertahan antar-run —
      # peran yang dulu diisi cache registry saat agent Jenkins sekali pakai.
      - name: Bangun & dorong image aplikasi
        run: |
          set -euo pipefail
          IMAGE="${{ steps.refs.outputs.app_image }}"
          timeout 5400 docker build --progress=plain \
            -t "$IMAGE" \
            --secret id=NEXTAUTH_SECRET,src=.secrets/nextauth_secret.txt \
            --secret id=AUTH_SECRET,src=.secrets/auth_secret.txt \
            --secret id=OAUTH_ENCRYPTION_KEY,src=.secrets/oauth_key.txt \
            --build-arg IMAGE_REVISION="${GITHUB_SHA}" \
            --build-arg NEXT_BUILD_CPUS=1 \
            --build-arg NEXT_BUILD_FLAGS=--webpack \
            --build-arg NODE_OPTIONS="--no-deprecation --max-old-space-size=6144" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_DATABASE_URL="${{ secrets.NEXT_PUBLIC_FIREBASE_DATABASE_URL }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}" \
            --build-arg NEXT_PUBLIC_VAPID_PUBLIC_KEY="${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}" \
            --build-arg SKIP_TS_CHECK=true \
            .
          timeout 3600 docker push "$IMAGE"

      - name: Bangun & dorong image cron
        run: |
          set -euo pipefail
          IMAGE="${{ steps.refs.outputs.cron_image }}"
          timeout 600 docker build --progress=plain -t "$IMAGE" ./cron
          timeout 1800 docker push "$IMAGE"

      - name: Bangun & dorong image radius
        run: |
          set -euo pipefail
          IMAGE="${{ steps.refs.outputs.radius_image }}"
          timeout 900 docker build --progress=plain -t "$IMAGE" -f radius/Dockerfile .
          timeout 1800 docker push "$IMAGE"

      - name: Bersihkan secret build
        if: always()
        run: rm -rf .secrets

  deploy:
    needs: build
    runs-on: netmanager-ci
    steps:
      # actions/checkout diunduh dari github.com setiap job, dan dari mesin ini
      # github.com sering i/o timeout sementara transfer besarnya ~4 KB/s.
      # Repositorinya sendiri ada di Gitea lokal, jadi kode diambil langsung
      # dari sana tanpa perantara mana pun.
      - name: Ambil kode dari Gitea
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${REPO_CLONE_URL}"
          # Token ditaruh di config lokal, bukan di argumen perintah, supaya
          # tidak terbaca lewat daftar proses.
          git config --local http.extraheader \
            "Authorization: basic $(printf 'x-access-token:%s' '${{ github.token }}' | base64 -w0)"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          git config --local --unset-all http.extraheader

      - name: Siapkan kunci SSH deploy
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Sidik jari host disematkan supaya deploy tidak bisa dibajak lewat
          # host palsu; StrictHostKeyChecking=no akan menerima siapa saja.
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Render manifes dengan image baru
        run: |
          set -euo pipefail
          mkdir -p rendered
          for manifest in "${K8S_DIR}"/*.yaml k8s/migration-job.yaml; do
            [ -f "$manifest" ] || continue
            case "$(basename "$manifest")" in
              secrets.yaml|registry-secret.yaml) continue ;;
            esac
            sed \
              -e "s|{{APP_IMAGE}}|${{ needs.build.outputs.app_image }}|g" \
              -e "s|{{CRON_IMAGE}}|${{ needs.build.outputs.cron_image }}|g" \
              -e "s|{{RADIUS_IMAGE}}|${{ needs.build.outputs.radius_image }}|g" \
              -e "s|{{NAMESPACE}}|${NAMESPACE}|g" \
              -e "s|{{IMAGE_TAG}}|${{ needs.build.outputs.app_image }}|g" \
              -e "s|{{REGISTRY_SECRET}}|${NAMESPACE}-registry|g" \
              "$manifest" > "rendered/$(basename "$manifest")"
          done

          # Placeholder yang tersisa berarti render gagal; menerapkannya akan
          # membuat Kubernetes menarik image bernama harfiah "{{APP_IMAGE}}".
          if grep -rlF -e '{{APP_IMAGE}}' -e '{{CRON_IMAGE}}' -e '{{RADIUS_IMAGE}}' rendered/; then
            echo "Render manifes menyisakan placeholder" >&2
            exit 1
          fi

      # Tiga pemeriksaan berikut dibawa dari Jenkinsfile sebelum berkas itu
      # dihapus; tidak satu pun ikut terbawa saat pipeline pindah ke Gitea.
      # Ketiganya menyangkut keadaan cluster yang tidak terbaca dari repositori,
      # dan ketiganya gagal dengan cara yang mahal bila baru ketahuan di tahap
      # apply — setelah build berjalan puluhan menit.
      - name: Preflight produksi
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/deploy -o BatchMode=yes ${{ secrets.DEPLOY_SSH_TARGET }}"

          # 1/3 — Kesehatan node. Perubahan workload di atas node yang
          # Ready=False atau kehabisan disk berisiko terpotong di tengah, dan
          # migrasi yang terpotong jauh lebih mahal daripada deploy tertunda.
          #
          # Kueri ditaruh di variabel ber-kutip tunggal supaya tanda kutip di
          # dalamnya tidak ikut diurai shell runner; yang menyeberang ke host
          # hanyalah teks kueri apa adanya.
          echo "Preflight 1/3 — kesehatan node"
          KUERI_NODE='{range .items[*]}{.metadata.name}{"="}{range .status.conditions[*]}{.type}={.status}{" "}{end}{"\n"}{end}'
          NODE="$($SSH "sudo -n kubectl get nodes -o jsonpath='${KUERI_NODE}'")"
          printf '%s\n' "${NODE}"

          if printf '%s\n' "${NODE}" | grep -Eq "Ready=False|DiskPressure=True"; then
            echo "::error::Node produksi tidak sehat (Ready=False atau DiskPressure=True); deploy dibatalkan sebelum menyentuh cluster." >&2
            $SSH "sudo -n kubectl describe nodes" >&2 || true
            $SSH "sudo -n kubectl top nodes" >&2 || true
            exit 1
          fi

          # 2/3 — Secret pull registry. Tanpa secret ini rollout tetap
          # terjadwal lalu tertahan di ImagePullBackOff: langkah apply hijau,
          # aplikasinya tidak pernah naik. Template placeholder di repositori
          # sengaja tidak di-apply, jadi secret hidup harus sudah ada.
          echo "Preflight 2/3 — secret pull registry"
          if ! $SSH "sudo -n kubectl -n ${NAMESPACE} get secret ${NAMESPACE}-registry" >/dev/null 2>&1; then
            echo "::error::Secret pull registry ${NAMESPACE}-registry belum ada di namespace ${NAMESPACE}. Bootstrap dulu dengan: kubectl create secret docker-registry ${NAMESPACE}-registry --namespace=${NAMESPACE} --docker-server=<registry> --docker-username=<user> --docker-password=<token>" >&2
            exit 1
          fi

          # 3/3 — Secret runtime bukan lagi placeholder. Nilainya dibandingkan
          # di host produksi, di dalam variabel shell yang tidak pernah
          # dicetak, dan tidak pernah ditarik ke runner: yang menyeberang hanya
          # status lolos/gagal.
          #
          # Perbandingannya ditulis eksplisit, bukan lewat `grep -qxv`:
          # perilaku grep pada masukan kosong berbeda antar implementasi, dan
          # nilai kosong justru kondisi yang paling perlu tertangkap di sini.
          echo "Preflight 3/3 — secret runtime bukan placeholder"
          if ! $SSH "sudo -n kubectl -n ${NAMESPACE} get secret netmanager-secrets" >/dev/null 2>&1; then
            echo "::error::Secret netmanager-secrets tidak ada di namespace ${NAMESPACE}; bootstrap secret sungguhan sebelum deploy." >&2
            exit 1
          fi

          if ! $SSH "nilai=\$(sudo -n kubectl -n ${NAMESPACE} get secret netmanager-secrets -o jsonpath='{.data.CRON_SECRET}' | base64 -d | tr -d '\r\n'); [ -n \"\$nilai\" ] && [ \"\$nilai\" != REPLACE_WITH_REAL_SECRET_BEFORE_DEPLOY ]"; then
            echo "::error::CRON_SECRET pada netmanager-secrets masih REPLACE_WITH_REAL_SECRET_BEFORE_DEPLOY atau kosong; isi nilai sungguhan sebelum deploy." >&2
            exit 1
          fi

          echo "Preflight lolos."

      # Jenkins mencadangkan basis data sebelum migrasi dan membatalkan deploy
      # bila cadangan gagal. Jaminan itu tidak ikut pindah ke Gitea, sehingga
      # migrasi produksi sempat berjalan tanpa titik balik sama sekali.
      #
      # Jenkins hanya mencadangkan basis data utama, padahal migrasi menyentuh
      # empat: netmanager, radius, billing, dan mitra. Tiga sisanya ikut
      # dicadangkan di sini.
      #
      # Dump ditulis di host produksi, tempat basis datanya berada, bukan
      # dialirkan ke runner: ~250 MB per deploy tidak perlu menyeberang hanya
      # untuk disimpan.
      - name: Cadangkan database sebelum migrasi
        env:
          IZIN_TANPA_CADANGAN: ${{ github.event.inputs.allow_migration_without_backup }}
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/deploy -o BatchMode=yes ${{ secrets.DEPLOY_SSH_TARGET }}"
          DIR_CADANGAN=/var/backups/netmanager
          STEMPEL="$(date +%Y%m%d_%H%M%S)"
          # Dump yang sehat berukuran puluhan MB; ambang ini hanya menyaring
          # berkas yang praktis kosong karena aliran putus di awal.
          UKURAN_MINIMUM=1024

          batalkan_atau_lanjut() {
            if [ "${IZIN_TANPA_CADANGAN:-false}" = "true" ]; then
              echo "::warning::Cadangan $1 gagal, migrasi tetap lanjut karena allow_migration_without_backup=true"
              return 0
            fi

            echo "::error::Cadangan pra-migrasi gagal ($1); migrasi dibatalkan sebelum menyentuh basis data. Jalankan ulang lewat workflow_dispatch dengan allow_migration_without_backup=true hanya untuk keadaan darurat yang disengaja." >&2
            exit 1
          }

          $SSH "sudo -n mkdir -p ${DIR_CADANGAN} && sudo -n chown \$(id -u):\$(id -g) ${DIR_CADANGAN}"

          for NAMA_URL in DATABASE_URL RADIUS_DATABASE_URL DATABASE_URL_BILLING DATABASE_URL_MITRA; do
            MENTAH="${DIR_CADANGAN}/${STEMPEL}_${NAMA_URL}.sql"
            BERKAS="${MENTAH}.gz"
            echo "Mencadangkan ${NAMA_URL} ke ${BERKAS}"

            # Tidak ada pipa di mana pun pada perintah ini, dan itu disengaja.
            # Status keluar sebuah pipa adalah status perintah terakhirnya,
            # sehingga `pg_dump ... | gzip` melaporkan sukses meski pg_dump
            # mati di tengah — gzip menerima EOF dan tetap menutup arsipnya
            # dengan rapi, jadi hasilnya gzip sah berisi dump terpotong yang
            # lolos `gzip -t`. Dump ditulis apa adanya dulu, baru dikompresi
            # sebagai perintah terpisah, agar tiap tahap punya status sendiri.
            #
            # Query string dibuang lebih dulu: URL billing dan mitra membawa
            # `?schema=public&connection_limit=...` yang diterima Prisma tetapi
            # ditolak libpq dengan "invalid URI query parameter". Tanda tanya
            # pada bagian kredensial wajib ter-percent-encode menurut RFC 3986,
            # jadi tanda tanya pertama selalu awal query string.
            if ! $SSH "sudo -n kubectl -n ${NAMESPACE} exec deployment/netmanager-app -- sh -c 'pg_dump \"\$(printenv ${NAMA_URL} | sed \"s/?.*//\")\" --no-owner --no-privileges' > ${MENTAH}"; then
              $SSH "rm -f ${MENTAH}" || true
              batalkan_atau_lanjut "${NAMA_URL}: pg_dump"
              continue
            fi

            if ! $SSH "gzip -f ${MENTAH}"; then
              $SSH "rm -f ${MENTAH} ${BERKAS}" || true
              batalkan_atau_lanjut "${NAMA_URL}: kompresi"
              continue
            fi

            # Pemeriksaan terakhir: arsip terbaca utuh dan tidak praktis kosong.
            if ! $SSH "gzip -t ${BERKAS} && [ \"\$(stat -c %s ${BERKAS})\" -ge ${UKURAN_MINIMUM} ]"; then
              batalkan_atau_lanjut "${NAMA_URL}: arsip tidak utuh"
              continue
            fi

            echo "Cadangan ${NAMA_URL} utuh."
          done

          $SSH "sudo -n ls -lh ${DIR_CADANGAN} | tail -n 5"
          # Tanpa pembuangan, empat dump per deploy mengisi disk produksi
          # diam-diam sampai node berubah DiskPressure=True.
          $SSH "find ${DIR_CADANGAN} -name '*.sql.gz' -mtime +7 -delete 2>/dev/null || true"

      - name: Jalankan migrasi database
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/deploy -o BatchMode=yes ${{ secrets.DEPLOY_SSH_TARGET }}"

          # Job lama dihapus lebih dulu: Job Kubernetes bersifat immutable,
          # apply ulang ke Job yang sudah ada akan ditolak.
          $SSH "sudo -n kubectl -n ${NAMESPACE} delete job netmanager-migration-job --ignore-not-found"
          $SSH "sudo -n kubectl -n ${NAMESPACE} apply -f -" < rendered/migration-job.yaml

          echo "Menunggu migrasi selesai..."
          # Batas tunggu ini harus lebih panjang daripada activeDeadlineSeconds
          # milik Job (k8s/migration-job.yaml). Bila lebih pendek, CI menyerah
          # lebih dulu dan menyatakan deploy gagal sementara Job masih berjalan
          # dan mungkin tetap selesai — migrasi terlanjur berjalan tanpa
          # pipeline yang menyusulnya. Biarkan deadline Job yang memutuskan.
          $SSH "sudo -n kubectl -n ${NAMESPACE} wait --for=condition=complete --timeout=3900s job/netmanager-migration-job" || {
            echo "::error::Migrasi gagal atau melewati batas waktu" >&2

            # Job yang podnya tidak pernah terjadwal — ImagePullBackOff, kuota
            # habis, tekanan sumber daya — tidak punya log sama sekali.
            # `kubectl logs` pada kasus itu diam, dan penyebabnya hanya terbaca
            # dari describe.
            $SSH "sudo -n kubectl -n ${NAMESPACE} describe job netmanager-migration-job" >&2 || true

            POD="$($SSH "sudo -n kubectl -n ${NAMESPACE} get pods -l job-name=netmanager-migration-job -o jsonpath='{.items[0].metadata.name}'" 2>/dev/null || true)"
            if [ -n "${POD}" ]; then
              $SSH "sudo -n kubectl -n ${NAMESPACE} describe pod ${POD}" >&2 || true
              $SSH "sudo -n kubectl -n ${NAMESPACE} logs ${POD} --tail=100" >&2 || true
            fi

            exit 1
          }

      - name: Terapkan manifes
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/deploy -o BatchMode=yes ${{ secrets.DEPLOY_SSH_TARGET }}"
          for manifest in rendered/*.yaml; do
            case "$(basename "$manifest")" in
              migration-job.yaml) continue ;;
            esac
            echo "apply $(basename "$manifest")"
            $SSH "sudo -n kubectl -n ${NAMESPACE} apply -f -" < "$manifest"
          done

      - name: Tunggu rollout
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/deploy -o BatchMode=yes ${{ secrets.DEPLOY_SSH_TARGET }}"
          for deployment in netmanager-app netmanager-worker netmanager-cron netmanager-radius; do
            echo "menunggu ${deployment}"
            $SSH "sudo -n kubectl -n ${NAMESPACE} rollout status deploy/${deployment} --timeout=420s"
          done

      - name: Verifikasi image yang benar-benar aktif
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/deploy -o BatchMode=yes ${{ secrets.DEPLOY_SSH_TARGET }}"
          AKTIF="$($SSH "sudo -n kubectl -n ${NAMESPACE} get deploy netmanager-app -o jsonpath='{.spec.template.spec.containers[0].image}'")"
          echo "aktif   : ${AKTIF}"
          echo "harusnya: ${{ needs.build.outputs.app_image }}"
          # Rollout bisa dilaporkan sukses padahal manifes lama yang terpasang;
          # pemeriksaan ini menutup celah itu.
          [ "${AKTIF}" = "${{ needs.build.outputs.app_image }}" ]

      - name: Hapus kunci SSH
        if: always()
        run: rm -f ~/.ssh/deploy ~/.ssh/known_hosts
