<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Install Employee Portal</title>
    <meta name="description" content="Install the NetManager Employee Portal for quick access to your dashboard, attendance, leaves, and payslips." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#6366f1" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
      }
      .container {
        text-align: center;
        padding: 2rem;
        max-width: 500px;
      }
      .icon {
        width: 120px;
        height: 120px;
        margin: 0 auto 2rem;
        background: white;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 64px;
        font-weight: bold;
        color: #6366f1;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      h1 {
        font-size: 2rem;
        margin-bottom: 1rem;
      }
      p {
        font-size: 1.1rem;
        opacity: 0.9;
        margin-bottom: 2rem;
      }
      .button {
        background: white;
        color: #6366f1;
        padding: 1rem 2rem;
        border-radius: 12px;
        text-decoration: none;
        font-weight: bold;
        display: inline-block;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        transition: transform 0.2s;
      }
      .button:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">E</div>
      <h1>Employee Portal</h1>
      <p>Install our app for quick access to attendance, leaves, and payslips right from your home screen.</p>
      <a href="/employee" class="button">Open Portal</a>
    </div>
  </body>
</html>
