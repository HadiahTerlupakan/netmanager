<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Positioning Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Neumorphism styles */
    :root {
      --color-bg-primary: 248 250 252;
      --color-bg-surface: 255 255 255;
      --color-bg-surface-variant: 241 245 249;
      --color-text-primary: 15 23 42;
      --color-text-secondary: 30 41 59;
      --color-text-tertiary: 71 85 105;
      --color-text-placeholder: 148 163 184;
      --color-border: 226 232 240;
      --color-primary: 79 70 229;
      --shadow-neumorphic-inset: inset 8px 8px 16px rgba(0, 0, 0, 0.08), inset -8px -8px 16px rgba(255, 255, 255, 0.95);
      --transition-base: 250ms cubic-bezier(0.4, 0.0, 0.2, 1);
    }

    .dark {
      --color-bg-primary: 15 15 30;
      --color-bg-surface: 26 26 46;
      --color-bg-surface-variant: 22 33 62;
      --color-text-primary: 255 255 255;
      --color-text-secondary: 255 255 255;
      --color-text-tertiary: 255 255 255 / 0.7;
      --color-text-placeholder: 255 255 255 / 0.5;
      --color-border: 255 255 255 / 0.1;
      --shadow-neumorphic-inset: inset 6px 6px 12px rgba(0, 0, 0, 0.3), inset -6px -6px 12px rgba(255, 255, 255, 0.1);
    }

    body {
      background-color: rgb(var(--color-bg-primary));
      color: rgb(var(--color-text-primary));
      transition: background-color var(--transition-base), color var(--transition-base);
    }

    .input-neumorphic {
      background: rgb(var(--color-bg-surface));
      box-shadow: var(--shadow-neumorphic-inset);
      border: 2px solid transparent;
      border-radius: 0.5rem;
      padding: 1rem;
      transition: all var(--transition-base);
      color: rgb(var(--color-text-primary));
    }

    .input-neumorphic:focus {
      outline: none;
      border-color: rgb(var(--color-primary));
      box-shadow: var(--shadow-neumorphic-inset), 0 0 0 3px rgba(var(--color-primary), 0.15);
    }

    .input-neumorphic::placeholder {
      color: rgb(var(--color-text-placeholder));
    }

    /* Input field with left icon - ensure proper spacing */
    .input-with-left-icon {
      padding-left: 3.5rem !important; /* 56px - space for icon + padding */
    }

    /* Input field with right icon - ensure proper spacing */
    .input-with-right-icon {
      padding-right: 3.5rem !important; /* 56px - space for icon + padding */
    }

    /* Input field with both left and right icons */
    .input-with-both-icons {
      padding-left: 3.5rem !important; /* 56px - space for left icon + padding */
      padding-right: 3.5rem !important; /* 56px - space for right icon + padding */
    }

    .glass-card {
      background: rgba(var(--color-bg-surface), 0.95);
      backdrop-filter: blur(20px) saturate(120%);
      -webkit-backdrop-filter: blur(20px) saturate(120%);
      border: 1px solid rgba(var(--color-border), 0.4);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 8px 16px rgba(0, 0, 0, 0.04);
      border-radius: 1rem;
    }
  </style>
</head>
<body class="min-h-screen p-8">
  <div class="max-w-md mx-auto">
    <!-- Theme Toggle -->
    <div class="flex justify-end mb-8">
      <button id="themeToggle" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700">
        <i class="fas fa-moon dark:hidden"></i>
        <i class="fas fa-sun hidden dark:inline"></i>
      </button>
    </div>

    <!-- Login Card -->
    <div class="glass-card p-8">
      <h1 class="text-2xl font-bold mb-6 text-center">Icon Positioning Test</h1>
      
      <!-- Employee ID Input -->
      <div class="mb-6">
        <label for="employeeId" class="block text-sm font-medium mb-2">
          Employee ID
        </label>
        <div class="relative">
          <div class="absolute left-4 top-1/2 -translate-y-1/2 opacity-60 transition-opacity duration-300 pointer-events-none">
            <i class="fas fa-user w-5 h-5"></i>
          </div>
          <input
            id="employeeId"
            type="text"
            placeholder="Enter your Employee ID"
            className="w-full py-4 min-h-[56px] input-neumorphic input-with-left-icon transition-all duration-300"
          />
        </div>
      </div>

      <!-- Password Input -->
      <div class="mb-6">
        <label for="password" class="block text-sm font-medium mb-2">
          Password
        </label>
        <div class="relative">
          <div class="absolute left-4 top-1/2 -translate-y-1/2 opacity-60 transition-opacity duration-300 pointer-events-none">
            <i class="fas fa-lock w-5 h-5"></i>
          </div>
          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            className="w-full py-4 min-h-[56px] input-neumorphic input-with-both-icons transition-all duration-300"
          />
          <button
            type="button"
            id="togglePassword"
            className="absolute right-4 top-1/2 -translate-y-1/2 opacity-60 hover:opacity-100 transition-opacity duration-300"
          >
            <i class="fas fa-eye w-5 h-5"></i>
          </button>
        </div>
      </div>

      <!-- Test Results -->
      <div class="mt-8 p-4 bg-blue-50 dark:bg-blue-900/20 rounded-lg">
        <h3 class="font-medium mb-2">Test Results:</h3>
        <ul class="text-sm space-y-1">
          <li id="test1" class="flex items-center gap-2">
            <i class="fas fa-check-circle text-green-500"></i>
            Icons properly positioned without overlapping text
          </li>
          <li id="test2" class="flex items-center gap-2">
            <i class="fas fa-check-circle text-green-500"></i>
            Proper spacing between icons and input text
          </li>
          <li id="test3" class="flex items-center gap-2">
            <i class="fas fa-check-circle text-green-500"></i>
            Theme compatibility maintained
          </li>
        </ul>
      </div>
    </div>
  </div>

  <script>
    // Theme toggle functionality
    const themeToggle = document.getElementById('themeToggle');
    const html = document.documentElement;
    
    // Check for saved theme preference or default to light
    const currentTheme = localStorage.getItem('theme') || 'light';
    html.classList.toggle('dark', currentTheme === 'dark');
    
    themeToggle.addEventListener('click', () => {
      html.classList.toggle('dark');
      const theme = html.classList.contains('dark') ? 'dark' : 'light';
      localStorage.setItem('theme', theme);
    });
    
    // Password visibility toggle
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const passwordIcon = togglePassword.querySelector('i');
    
    togglePassword.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      
      if (type === 'password') {
        passwordIcon.classList.remove('fa-eye-slash');
        passwordIcon.classList.add('fa-eye');
      } else {
        passwordIcon.classList.remove('fa-eye');
        passwordIcon.classList.add('fa-eye-slash');
      }
    });
  </script>
</body>
</html>
