apiVersion: batch/v1
kind: Job
metadata:
  name: netmanager-migration-job
  namespace: "{{NAMESPACE}}"
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: netmanager-migration
    spec:
      imagePullSecrets:
        - name: "{{REGISTRY_SECRET}}"
      # Jenkins renders {{REGISTRY_SECRET}} to one of these namespace-specific secrets:
      # - name: netmanager-staging-registry
      # - name: netmanager-production-registry
      restartPolicy: Never
      securityContext:
        fsGroup: 1001
      containers:
        - name: migration
          image: "{{IMAGE_TAG}}"
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          envFrom:
            - configMapRef:
                name: netmanager-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: DATABASE_URL
            - name: RADIUS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: RADIUS_DATABASE_URL
            - name: DATABASE_URL_BILLING
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: DATABASE_URL_BILLING
            - name: DATABASE_URL_MITRA
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: DATABASE_URL_MITRA
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: REDIS_PASSWORD
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: AUTH_SECRET
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: NEXTAUTH_SECRET
            - name: RADIUS_SECRET
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: RADIUS_SECRET
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: CRON_SECRET
            - name: OAUTH_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: OAUTH_ENCRYPTION_KEY
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: REDIS_URL
            - name: SKIP_OPTIONAL_BACKFILL
              value: "{{SKIP_OPTIONAL_BACKFILL}}"
          command:
            - "sh"
            - "-c"
            - |
              set -e

              echo "======================================"
              echo "🚀 NETMANAGER DATABASE MIGRATION JOB"
              echo "======================================"

              # =============================================
              # Safe Migration Guard
              # Automatically allows destructive migrations that include
              # a "-- @safe-guard-ack: <reason>" comment in the SQL file.
              # Blocks all unacknowledged destructive migrations.
              # =============================================
              echo ""
              echo "======================================"
              echo "🛡️ SAFE MIGRATION GUARD CHECK"
              echo "======================================"

              cat << 'GUARDEOF' > /tmp/safe-guard.js
              const fs = require('fs');
              const { execSync } = require('child_process');

              const DESTRUCTIVE_PATTERN = /DROP\s+TABLE|DROP\s+COLUMN|TRUNCATE|ALTER\s+TABLE\s+".*"\s+ALTER\s+COLUMN/i;
              const ACK_PATTERN = /--\s*@safe-guard-ack:/i;

              function checkDatabase(config, folder) {
                let unapplied = [];
                try {
                  execSync(`prisma migrate status ${config}`, { stdio: 'pipe', encoding: 'utf-8' });
                } catch (e) {
                  const out = (e.stdout || '') + '\n' + (e.stderr || '');
                  const cleanOut = out.replace(/\x1B\[\d+m/g, '');
                  const match = cleanOut.match(/have not yet been applied:\n([\s\S]*?)(?:\n\n|\n[A-Z]|$)/i);
                  if (match) {
                    unapplied = match[1].split('\n').map(s => s.trim()).filter(s => /^\d+_/.test(s));
                  }
                }

                let dangerous = false;
                for (const m of unapplied) {
                  const file = `${folder}/${m}/migration.sql`;
                  if (fs.existsSync(file)) {
                    const sql = fs.readFileSync(file, 'utf8');
                    if (DESTRUCTIVE_PATTERN.test(sql)) {
                      if (ACK_PATTERN.test(sql)) {
                        console.log(`✅ Destructive migration ACKNOWLEDGED: ${file}`);
                        const ackLine = sql.split('\n').find(l => ACK_PATTERN.test(l));
                        if (ackLine) console.log(`   Reason: ${ackLine.replace(/--\s*@safe-guard-ack:\s*/i, '').trim()}`);
                      } else {
                        console.error(`❌ Destructive SQL found WITHOUT acknowledgment: ${file}`);
                        console.error(`   Add "-- @safe-guard-ack: <alasan>" di baris pertama file untuk mengizinkan.`);
                        dangerous = true;
                      }
                    }
                  }
                }
                return dangerous;
              }

              const db = [
                { c: '', f: 'prisma/migrations' },
                { c: '--config=prisma.radius.config.ts', f: 'prisma/radius_migrations' },
                { c: '--config=prisma.billing.config.ts', f: 'prisma/billing_migrations' },
                { c: '--config=prisma.mitra.config.ts', f: 'prisma/mitra_migrations' }
              ];

              let hasDanger = false;
              for (const {c, f} of db) {
                if (checkDatabase(c, f)) hasDanger = true;
              }

              if (hasDanger) {
                console.error('❌ Pipeline dihentikan: unacknowledged destructive migration detected!');
                console.error('   Tambahkan "-- @safe-guard-ack: <alasan>" di file SQL yang bersangkutan.');
                process.exit(1);
              } else {
                console.log('✅ Safe migration guard passed.');
              }
              GUARDEOF

              node /tmp/safe-guard.js

              # =============================================
              # STEP 3: Resolve squashed baseline + Deploy
              # Only resolve if the migrations table already exists (not a fresh DB)
              # =============================================
              echo ""
              echo "======================================"
              echo "Running netmanager migrations"
              echo "======================================"

              sanitize_psql_url() {
                node -e 'const url = new URL(process.argv[1]); ["schema", "connection_limit", "pool_timeout"].forEach((name) => url.searchParams.delete(name)); process.stdout.write(url.toString())' "$1"
              }

              has_prisma_migration_record() {
                local database_url="$1"
                local migration_name="$2"
                local has_migrations_table

                has_migrations_table=$(psql "$database_url" -tAc "SELECT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name = '_prisma_migrations')" | tr -d '[:space:]')
                if [ "$has_migrations_table" != "t" ]; then
                  printf 'f'
                  return 0
                fi

                psql "$database_url" -tAc "SELECT EXISTS (SELECT 1 FROM _prisma_migrations WHERE migration_name = '$migration_name' AND rolled_back_at IS NULL)" | tr -d '[:space:]'
              }

              resolve_migration_if_unapplied() {
                local database_url="$1"
                local migration_name="$2"
                shift 2

                if [ "$(has_prisma_migration_record "$database_url" "$migration_name")" = "t" ]; then
                  echo "ℹ️ Migration already marked applied, skipping resolve: $migration_name"
                  return 0
                fi

                prisma migrate resolve --applied "$migration_name" "$@" 2>&1
              }

              DATABASE_URL_PSQL=$(sanitize_psql_url "$DATABASE_URL")
              RADIUS_DATABASE_URL_PSQL=$(sanitize_psql_url "$RADIUS_DATABASE_URL")
              DATABASE_URL_BILLING_PSQL=$(sanitize_psql_url "$DATABASE_URL_BILLING")
              DATABASE_URL_MITRA_PSQL=$(sanitize_psql_url "$DATABASE_URL_MITRA")

              # Check if it's a fresh database by checking for a known table
              IS_FRESH=$(psql "$DATABASE_URL_PSQL" -tAc "SELECT EXISTS (SELECT FROM information_schema.tables WHERE table_name = 'User')")

              if [ "$IS_FRESH" = "f" ]; then
                echo "🌱 Fresh database detected. Running all migrations from scratch..."
              else
                echo "🔄 Existing database detected. Applying baseline resolutions..."
                resolve_migration_if_unapplied "$DATABASE_URL_PSQL" 20260313000000_init_squashed

                # Apply tenant schema baseline before resolving it so tenant-aware follow-up migrations
                # do not run against databases that still lack tenantId columns.
                psql "$DATABASE_URL_PSQL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260314015651_init_tenant_schema/migration.sql
                resolve_migration_if_unapplied "$DATABASE_URL_PSQL" 20260314015651_init_tenant_schema
                prisma migrate resolve --applied 20260315020000_tenant_unique_constraints 2>&1 || true
                prisma migrate resolve --applied 20260318064750_add_pelanggan_username_unique_index 2>&1 || true
                prisma migrate resolve --applied 20260318065456_add_session_expires_index 2>&1 || true

                # Fix partially-applied migration: complete remaining changes via idempotent SQL
                # then mark as applied so Prisma does not try to re-run the full SQL.
                echo "🔧 Running idempotent fix for sync_schema_changes..."
                psql "$DATABASE_URL_PSQL" -v ON_ERROR_STOP=1 -f /app/scripts/fix-partial-sync-schema.sql 2>&1
                prisma migrate resolve --applied 20260326004412_sync_schema_changes 2>&1 || true

                # =============================================
                # Resolve failed migrations (P3009 recovery)
                # If a migration failed mid-apply, Prisma blocks all future deploys.
                # We roll-back the failed migration so it can be re-attempted.
                # The migration SQL must be idempotent to handle re-runs safely.
                # =============================================
                echo "🔍 Checking for failed migrations to roll back..."
                FAILED_MIGRATIONS=$(psql "$DATABASE_URL_PSQL" -tAc "SELECT migration_name FROM _prisma_migrations WHERE finished_at IS NULL AND rolled_back_at IS NULL")
                if [ -n "$FAILED_MIGRATIONS" ]; then
                  echo "⚠️ Found failed migrations, rolling back for re-attempt:"
                  echo "$FAILED_MIGRATIONS" | while IFS= read -r mig; do
                    echo "   Rolling back: $mig"
                    # Clean up any partially-created objects from the failed migration
                    # (idempotent — safe to run even if nothing to clean)
                    psql "$DATABASE_URL_PSQL" -c "DROP INDEX IF EXISTS \"idx_attendance_user_checkin_date_tenant\"" 2>&1 || true
                    psql "$DATABASE_URL_PSQL" -c "DROP INDEX IF EXISTS \"Holiday_date_tenantId_key\"" 2>&1 || true
                    prisma migrate resolve --rolled-back "$mig" 2>&1 || true
                  done
                  echo "✅ Failed migrations rolled back. They will be re-attempted below."
                else
                  echo "✅ No failed migrations found."
                fi
              fi

              prisma migrate deploy

              echo ""
              echo "======================================"
              echo "Running radius migrations"
              echo "======================================"

              if [ "$IS_FRESH" != "f" ]; then
                resolve_migration_if_unapplied "$RADIUS_DATABASE_URL_PSQL" 20260313000000_init_squashed --config=prisma.radius.config.ts
                psql "$RADIUS_DATABASE_URL_PSQL" -v ON_ERROR_STOP=1 -f prisma/radius_migrations/20260314015652_init_tenant_schema/migration.sql
                resolve_migration_if_unapplied "$RADIUS_DATABASE_URL_PSQL" 20260314015652_init_tenant_schema --config=prisma.radius.config.ts
              fi
              prisma migrate deploy --config=prisma.radius.config.ts

              echo ""
              echo "======================================"
              echo "Running billing migrations"
              echo "======================================"

              if [ "$IS_FRESH" != "f" ]; then
                resolve_migration_if_unapplied "$DATABASE_URL_BILLING_PSQL" 20260313000000_init_squashed --config=prisma.billing.config.ts
                psql "$DATABASE_URL_BILLING_PSQL" -v ON_ERROR_STOP=1 -f prisma/billing_migrations/20260314015654_init_tenant_schema/migration.sql
                resolve_migration_if_unapplied "$DATABASE_URL_BILLING_PSQL" 20260314015654_init_tenant_schema --config=prisma.billing.config.ts
              fi
              prisma migrate deploy --config=prisma.billing.config.ts

              echo ""
              echo "======================================"
              echo "Running mitra migrations"
              echo "======================================"

              if [ "$IS_FRESH" != "f" ]; then
                resolve_migration_if_unapplied "$DATABASE_URL_MITRA_PSQL" 20260313000000_init_squashed --config=prisma.mitra.config.ts
                psql "$DATABASE_URL_MITRA_PSQL" -v ON_ERROR_STOP=1 -f prisma/mitra_migrations/20260314015655_init_tenant_schema/migration.sql
                resolve_migration_if_unapplied "$DATABASE_URL_MITRA_PSQL" 20260314015655_init_tenant_schema --config=prisma.mitra.config.ts
              fi
              prisma migrate deploy --config=prisma.mitra.config.ts

              # =============================================
              # STEP 4: Backfill Data
              # Automatically assign all orphaned data to a Default Tenant
              # =============================================
              OPTIONAL_FAILURES=0
              run_optional_step() {
                local label="$1"
                shift

                echo ""
                echo "======================================"
                echo "Running optional step: ${label}"
                echo "======================================"

                if "$@"; then
                  echo "✅ Optional step succeeded: ${label}"
                else
                  OPTIONAL_FAILURES=$((OPTIONAL_FAILURES + 1))
                  echo "⚠️ Optional step failed: ${label}"
                  if [ "${FAIL_ON_OPTIONAL_MIGRATION_ERRORS:-false}" = "true" ]; then
                    echo "❌ FAIL_ON_OPTIONAL_MIGRATION_ERRORS=true, aborting migration job"
                    exit 1
                  fi
                fi
              }

              if [ "${SKIP_OPTIONAL_BACKFILL:-false}" = "true" ]; then
                echo "⏭️ SKIP_OPTIONAL_BACKFILL=true, skipping optional tenant backfill and repair steps"
                echo "⏭️ Skipped optional step: multi-tenant data backfill"
                echo "⏭️ Skipped optional step: tenant provisioning fix"
                echo "⏭️ Skipped optional step: legacy data migration (NETMANAGER)"
              else
                run_optional_step "multi-tenant data backfill" tsx scripts/backfill-tenant.ts
                run_optional_step "tenant provisioning fix" tsx scripts/fix-tenant-provision.ts
                run_optional_step "legacy data migration (NETMANAGER)" tsx scripts/migrate-legacy-tenant.ts
              fi

              if [ "$OPTIONAL_FAILURES" -gt 0 ]; then
                echo "⚠️ Optional migration steps completed with $OPTIONAL_FAILURES failure(s)"
                echo "❌ Failing migration job because optional backfill did not fully succeed"
                exit 1
              fi

              echo ""
              echo "======================================"
              echo "✅ ALL MIGRATIONS COMPLETED SUCCESSFULLY"
              echo "======================================"
