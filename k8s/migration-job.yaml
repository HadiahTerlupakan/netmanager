apiVersion: batch/v1
kind: Job
metadata:
  name: netmanager-migration-job
  namespace: "{{NAMESPACE}}"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: netmanager-migration
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1001
      containers:
        - name: migration
          image: "{{IMAGE_TAG}}"
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          envFrom:
            - configMapRef:
                name: netmanager-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: DATABASE_URL
            - name: RADIUS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: RADIUS_DATABASE_URL
            - name: DATABASE_URL_BILLING
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: DATABASE_URL_BILLING
            - name: DATABASE_URL_MITRA
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: DATABASE_URL_MITRA
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: REDIS_PASSWORD
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: AUTH_SECRET
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: NEXTAUTH_SECRET
            - name: RADIUS_SECRET
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: RADIUS_SECRET
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: CRON_SECRET
            - name: OAUTH_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: OAUTH_ENCRYPTION_KEY
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: REDIS_URL
          command:
            - "sh"
            - "-c"
            - |
              set -e

              echo "======================================"
              echo "🚀 NETMANAGER DATABASE MIGRATION JOB"
              echo "======================================"

              # =============================================
              # STEP 1: Clean ALL old migration records
              # TRUNCATE _prisma_migrations to remove ALL history
              # including failed records that block new migrations.
              # Uses DATABASE_URL env vars directly as psql connection strings.
              # TODO: Remove this step after first successful deployment.
              # =============================================
              echo ""
              echo "======================================"
              echo "🧹 Cleaning ALL migration history (squash reset)"
              echo "======================================"

              echo "Cleaning netmanager DB..."
              psql "$DATABASE_URL" -c "TRUNCATE TABLE \"_prisma_migrations\";" 2>&1 || echo "⚠️ netmanager cleanup skipped (table may not exist)"

              echo "Cleaning radius DB..."
              psql "$RADIUS_DATABASE_URL" -c "TRUNCATE TABLE \"_prisma_migrations\";" 2>&1 || echo "⚠️ radius cleanup skipped"

              echo "Cleaning billing DB..."
              psql "$DATABASE_URL_BILLING" -c "TRUNCATE TABLE \"_prisma_migrations\";" 2>&1 || echo "⚠️ billing cleanup skipped"

              echo "Cleaning mitra DB..."
              psql "$DATABASE_URL_MITRA" -c "TRUNCATE TABLE \"_prisma_migrations\";" 2>&1 || echo "⚠️ mitra cleanup skipped"

              echo "✅ Migration history cleaned."

              echo ""
              echo "=== Migration status after cleanup ==="
              npx prisma migrate status 2>&1 || true
              npx prisma migrate status --config=prisma.radius.config.ts 2>&1 || true
              npx prisma migrate status --config=prisma.billing.config.ts 2>&1 || true
              npx prisma migrate status --config=prisma.mitra.config.ts 2>&1 || true

              # =============================================
              # STEP 2: Safe Migration Guard
              # Automatically allows destructive migrations that include
              # a "-- @safe-guard-ack: <reason>" comment in the SQL file.
              # Blocks all unacknowledged destructive migrations.
              # =============================================
              echo ""
              echo "======================================"
              echo "🛡️ SAFE MIGRATION GUARD CHECK"
              echo "======================================"

              cat << 'GUARDEOF' > /tmp/safe-guard.js
              const fs = require('fs');
              const { execSync } = require('child_process');

              const DESTRUCTIVE_PATTERN = /DROP\s+TABLE|DROP\s+COLUMN|TRUNCATE|ALTER\s+TABLE\s+".*"\s+ALTER\s+COLUMN/i;
              const ACK_PATTERN = /--\s*@safe-guard-ack:/i;

              function checkDatabase(config, folder) {
                let unapplied = [];
                try {
                  execSync(`npx prisma migrate status ${config}`, { stdio: 'pipe', encoding: 'utf-8' });
                } catch (e) {
                  const out = (e.stdout || '') + '\n' + (e.stderr || '');
                  const cleanOut = out.replace(/\x1B\[\d+m/g, '');
                  const match = cleanOut.match(/have not yet been applied:\n([\s\S]*?)(?:\n\n|\n[A-Z]|$)/i);
                  if (match) {
                    unapplied = match[1].split('\n').map(s => s.trim()).filter(s => /^\d+_/.test(s));
                  }
                }

                let dangerous = false;
                for (const m of unapplied) {
                  const file = `${folder}/${m}/migration.sql`;
                  if (fs.existsSync(file)) {
                    const sql = fs.readFileSync(file, 'utf8');
                    if (DESTRUCTIVE_PATTERN.test(sql)) {
                      if (ACK_PATTERN.test(sql)) {
                        console.log(`✅ Destructive migration ACKNOWLEDGED: ${file}`);
                        const ackLine = sql.split('\n').find(l => ACK_PATTERN.test(l));
                        if (ackLine) console.log(`   Reason: ${ackLine.replace(/--\s*@safe-guard-ack:\s*/i, '').trim()}`);
                      } else {
                        console.error(`❌ Destructive SQL found WITHOUT acknowledgment: ${file}`);
                        console.error(`   Add "-- @safe-guard-ack: <alasan>" di baris pertama file untuk mengizinkan.`);
                        dangerous = true;
                      }
                    }
                  }
                }
                return dangerous;
              }

              const db = [
                { c: '', f: 'prisma/migrations' },
                { c: '--config=prisma.radius.config.ts', f: 'prisma/radius_migrations' },
                { c: '--config=prisma.billing.config.ts', f: 'prisma/billing_migrations' },
                { c: '--config=prisma.mitra.config.ts', f: 'prisma/mitra_migrations' }
              ];

              let hasDanger = false;
              for (const {c, f} of db) {
                if (checkDatabase(c, f)) hasDanger = true;
              }

              if (hasDanger) {
                console.error('❌ Pipeline dihentikan: unacknowledged destructive migration detected!');
                console.error('   Tambahkan "-- @safe-guard-ack: <alasan>" di file SQL yang bersangkutan.');
                process.exit(1);
              } else {
                console.log('✅ Safe migration guard passed.');
              }
              GUARDEOF

              node /tmp/safe-guard.js

              # =============================================
              # STEP 3: Resolve squashed baseline + Deploy
              # Mark init_squashed as already applied (it represents
              # the existing DB state), then deploy new_features.
              # =============================================
              echo ""
              echo "======================================"
              echo "Running netmanager migrations"
              echo "======================================"

              npx prisma migrate resolve --applied 20260313000000_init_squashed 2>&1 || true
              npx prisma migrate deploy

              echo ""
              echo "======================================"
              echo "Running radius migrations"
              echo "======================================"

              npx prisma migrate resolve --applied 20260313000000_init_squashed --config=prisma.radius.config.ts 2>&1 || true
              npx prisma migrate deploy --config=prisma.radius.config.ts

              echo ""
              echo "======================================"
              echo "Running billing migrations"
              echo "======================================"

              npx prisma migrate resolve --applied 20260313000000_init_squashed --config=prisma.billing.config.ts 2>&1 || true
              npx prisma migrate deploy --config=prisma.billing.config.ts

              echo ""
              echo "======================================"
              echo "Running mitra migrations"
              echo "======================================"

              npx prisma migrate resolve --applied 20260313000000_init_squashed --config=prisma.mitra.config.ts 2>&1 || true
              npx prisma migrate deploy --config=prisma.mitra.config.ts

              echo ""
              echo "======================================"
              echo "✅ ALL MIGRATIONS COMPLETED SUCCESSFULLY"
              echo "======================================"
