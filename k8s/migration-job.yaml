apiVersion: batch/v1
kind: Job
metadata:
  name: netmanager-migration-job
  namespace: "{{NAMESPACE}}"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: netmanager-migration
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1001
      containers:
        - name: migration
          image: "{{IMAGE_TAG}}"
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          envFrom:
            - configMapRef:
                name: netmanager-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: DATABASE_URL
            - name: RADIUS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: RADIUS_DATABASE_URL
            - name: DATABASE_URL_BILLING
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: DATABASE_URL_BILLING
            - name: DATABASE_URL_MITRA
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: DATABASE_URL_MITRA
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: REDIS_PASSWORD
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: AUTH_SECRET
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: NEXTAUTH_SECRET
            - name: RADIUS_SECRET
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: RADIUS_SECRET
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: CRON_SECRET
            - name: OAUTH_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: OAUTH_ENCRYPTION_KEY
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: REDIS_URL
          command:
            - "sh"
            - "-c"
            - |
              set -e

              echo "======================================"
              echo "🚀 NETMANAGER DATABASE MIGRATION JOB"
              echo "======================================"

              echo ""
              echo "=== Checking migration status ==="
              npx prisma migrate status || true
              npx prisma migrate status --config=prisma.radius.config.ts || true
              npx prisma migrate status --config=prisma.billing.config.ts || true
              npx prisma migrate status --config=prisma.mitra.config.ts || true

              echo ""
              echo "======================================"
              echo "🛡️ SAFE MIGRATION GUARD CHECK"
              echo "======================================"
              DANGEROUS=0

              for sql_file in prisma/migrations/*/migration.sql; do
                if [ -f "$sql_file" ] && grep -Ei "DROP TABLE|DROP COLUMN|TRUNCATE|ALTER.*TYPE" "$sql_file"; then
                  echo "⚠️ Destructive SQL found in: $sql_file"
                  DANGEROUS=1
                fi
              done

              for sql_file in prisma/radius_migrations/*/migration.sql; do
                if [ -f "$sql_file" ] && grep -Ei "DROP TABLE|DROP COLUMN|TRUNCATE|ALTER.*TYPE" "$sql_file"; then
                  echo "⚠️ Destructive SQL found in: $sql_file"
                  DANGEROUS=1
                fi
              done

              for sql_file in prisma/billing_migrations/*/migration.sql; do
                if [ -f "$sql_file" ] && grep -Ei "DROP TABLE|DROP COLUMN|TRUNCATE|ALTER.*TYPE" "$sql_file"; then
                  echo "⚠️ Destructive SQL found in: $sql_file"
                  DANGEROUS=1
                fi
              done

              for sql_file in prisma/mitra_migrations/*/migration.sql; do
                if [ -f "$sql_file" ] && grep -Ei "DROP TABLE|DROP COLUMN|TRUNCATE|ALTER.*TYPE" "$sql_file"; then
                  echo "⚠️ Destructive SQL found in: $sql_file"
                  DANGEROUS=1
                fi
              done

              if [ "$DANGEROUS" = "1" ]; then
                echo "❌ Pipeline dihentikan: destructive migration detected!"
                exit 1
              fi
              echo "✅ Safe migration check passed."

              echo ""
              echo "======================================"
              echo "Running netmanager migrations"
              echo "======================================"

              npx prisma migrate deploy

              echo ""
              echo "======================================"
              echo "Running radius migrations"
              echo "======================================"

              npx prisma migrate deploy --config=prisma.radius.config.ts

              echo ""
              echo "======================================"
              echo "Running billing migrations"
              echo "======================================"

              npx prisma migrate deploy --config=prisma.billing.config.ts

              echo ""
              echo "======================================"
              echo "Running mitra migrations"
              echo "======================================"

              npx prisma migrate deploy --config=prisma.mitra.config.ts

              echo ""
              echo "======================================"
              echo "✅ ALL MIGRATIONS COMPLETED SUCCESSFULLY"
              echo "======================================"
