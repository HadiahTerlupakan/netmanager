# Konfigurasi chart Traefik bawaan k3s (kube-system).
#
# externalTrafficPolicy: Local mempertahankan IP asli pengunjung. Dengan nilai
# bawaan "Cluster", kube-proxy menyamarkan (SNAT) setiap koneksi menjadi IP
# internal node (10.42.0.1), sehingga X-Real-Ip/X-Forwarded-For yang dibaca
# aplikasi — dan kolom IP di Log Aktivitas — selalu berisi 10.42.0.1.
#
# Aman karena cluster hanya punya satu node dan pod Traefik berjalan di node itu
# (policy Local hanya meneruskan trafik ke pod di node penerima).
#
# Manifes tingkat cluster (namespace kube-system): TIDAK diterapkan skrip deploy,
# yang hanya menerapkan k8s/production ke namespace netmanager-production.
# Terapkan manual: sudo kubectl apply -f k8s/cluster/traefik-helmchartconfig.yaml
# k3s helm-controller lalu menjalankan helm upgrade chart Traefik otomatis.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        externalTrafficPolicy: Local
