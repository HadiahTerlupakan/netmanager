apiVersion: v1
kind: ServiceAccount
metadata:
  name: netmanager-app
  namespace: netmanager-staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-certificate-manager
  namespace: netmanager-staging
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["create", "get", "list", "delete", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: netmanager-cert-manager-binding
  namespace: netmanager-staging
subjects:
  - kind: ServiceAccount
    name: netmanager-app
    namespace: netmanager-staging
roleRef:
  kind: Role
  name: cert-manager-certificate-manager
  apiGroup: rbac.authorization.k8s.io
