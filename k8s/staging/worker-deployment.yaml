apiVersion: apps/v1
kind: Deployment
metadata:
  name: netmanager-worker
  namespace: netmanager-staging
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: netmanager-worker
  template:
    metadata:
      labels:
        app: netmanager-worker
    spec:
      imagePullSecrets:
        - name: netmanager-staging-registry
      securityContext:
        fsGroup: 1001
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: "{{APP_IMAGE}}"
          imagePullPolicy: IfNotPresent
          command: ["node", "node_modules/.bin/tsx", "worker.ts"]
          envFrom:
            - configMapRef:
                name: netmanager-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: DATABASE_URL
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: REDIS_PASSWORD
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: AUTH_SECRET
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: NEXTAUTH_SECRET
            - name: RADIUS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: RADIUS_DATABASE_URL
            - name: DATABASE_URL_BILLING
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: DATABASE_URL_BILLING
            - name: DATABASE_URL_MITRA
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: DATABASE_URL_MITRA
            - name: RADIUS_SECRET
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: RADIUS_SECRET
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: CRON_SECRET
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: REDIS_URL
            - name: OAUTH_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: OAUTH_ENCRYPTION_KEY
            - name: ENABLE_INTERNAL_CRON
              value: "false"
            - name: ENABLE_EVENT_BUS_WORKERS
              value: "true"
            - name: FIREBASE_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: netmanager-firebase-secrets
                  key: FIREBASE_PROJECT_ID
            - name: FIREBASE_CLIENT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: netmanager-firebase-secrets
                  key: FIREBASE_CLIENT_EMAIL
            - name: FIREBASE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: netmanager-firebase-secrets
                  key: FIREBASE_PRIVATE_KEY
            - name: FIREBASE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: netmanager-firebase-secrets
                  key: FIREBASE_DATABASE_URL
                  optional: true
          volumeMounts:
            - name: uploads-volume
              mountPath: /app/public/uploads
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "750m"
              memory: "576Mi"
      volumes:
        - name: uploads-volume
          persistentVolumeClaim:
            claimName: netmanager-uploads
