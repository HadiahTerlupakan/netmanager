apiVersion: v1
kind: Secret
metadata:
  name: netmanager-secrets
  namespace: netmanager-staging
type: Opaque
# NOTE: Semua nilai harus dalam base64. Gunakan `echo -n 'nilai' | base64`
stringData:
  POSTGRES_PASSWORD: "netmanager_staging_db_pass"
  REDIS_PASSWORD: "netmanager_staging_redis_pass"
  RADIUS_SECRET: "netmanager_staging_radius_secret"
  AUTH_SECRET: "***REMOVED***"
  NEXTAUTH_SECRET: "***REMOVED***"
  OAUTH_ENCRYPTION_KEY: "***REMOVED***"
  CRON_SECRET: "***REMOVED***"
  REDIS_URL: "redis://:netmanager_staging_redis_pass@redis:6379"
  DATABASE_URL: "postgresql://netmgr:netmanager_staging_db_pass@db-netmanager:5432/netmanager"
  RADIUS_DATABASE_URL: "postgresql://netmgr:netmanager_staging_db_pass@db-radius:5432/radius"
  DATABASE_URL_BILLING: "postgresql://netmgr:netmanager_staging_db_pass@db-billing:5432/billing?schema=public&connection_limit=20&pool_timeout=10"
  DATABASE_URL_MITRA: "postgresql://netmgr:netmanager_staging_db_pass@db-mitra:5432/mitra?schema=public&connection_limit=20&pool_timeout=10"
