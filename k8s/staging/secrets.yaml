# NOTE: Sangat disarankan untuk menggunakan SOPS atau SealedSecrets untuk menyimpan file secret di repositori dengan aman.
apiVersion: v1
kind: Secret
metadata:
  name: netmanager-secrets
  namespace: netmanager-staging
type: Opaque
# NOTE: Semua nilai harus dalam base64. Gunakan `echo -n 'nilai' | base64`
stringData:
  POSTGRES_PASSWORD: "REPLACE_WITH_REAL_SECRET_BEFORE_DEPLOY"
  REDIS_PASSWORD: "REPLACE_WITH_REAL_SECRET_BEFORE_DEPLOY"
  RADIUS_SECRET: "REPLACE_WITH_REAL_SECRET_BEFORE_DEPLOY"
  AUTH_SECRET: "REPLACE_WITH_REAL_SECRET_BEFORE_DEPLOY"
  NEXTAUTH_SECRET: "REPLACE_WITH_REAL_SECRET_BEFORE_DEPLOY"
  OAUTH_ENCRYPTION_KEY: "REPLACE_WITH_REAL_SECRET_BEFORE_DEPLOY"
  CRON_SECRET: "REPLACE_WITH_REAL_SECRET_BEFORE_DEPLOY"
  REDIS_URL: "redis://:REPLACE_WITH_REAL_SECRET_BEFORE_DEPLOY@redis:6379"
  DATABASE_URL: "postgresql://netmgr:REPLACE_WITH_REAL_SECRET_BEFORE_DEPLOY@db-netmanager:5432/netmanager?connection_limit=10&pool_timeout=10"
  RADIUS_DATABASE_URL: "postgresql://netmgr:REPLACE_WITH_REAL_SECRET_BEFORE_DEPLOY@db-radius:5432/radius?connection_limit=10&pool_timeout=10"
  DATABASE_URL_BILLING: "postgresql://netmgr:REPLACE_WITH_REAL_SECRET_BEFORE_DEPLOY@db-billing:5432/billing?schema=public&connection_limit=20&pool_timeout=10"
  DATABASE_URL_MITRA: "postgresql://netmgr:REPLACE_WITH_REAL_SECRET_BEFORE_DEPLOY@db-mitra:5432/mitra?schema=public&connection_limit=20&pool_timeout=10"
  FIREBASE_PROJECT_ID: "REPLACE_WITH_REAL_SECRET_BEFORE_DEPLOY"
  FIREBASE_CLIENT_EMAIL: "REPLACE_WITH_REAL_SECRET_BEFORE_DEPLOY"
  FIREBASE_PRIVATE_KEY: "REPLACE_WITH_REAL_SECRET_BEFORE_DEPLOY"
  FIREBASE_DATABASE_URL: "REPLACE_WITH_REAL_SECRET_BEFORE_DEPLOY"
