# SECURITY: Jenkins is protected by Traefik BasicAuth middleware.
# To create the middleware, run:
# kubectl create secret generic jenkins-auth-secret \
#   --from-literal=users='admin:$apr1$...' \  # htpasswd -nb admin yourpassword
#   -n netmanager-staging
# Then apply k8s/staging/jenkins-auth-middleware.yaml

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jenkins-proxy-headers
  namespace: netmanager-staging
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
      X-Forwarded-Port: "443"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jenkins-ingress
  namespace: netmanager-staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: netmanager-staging-jenkins-proxy-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - jenkins.radpro.id
      secretName: jenkins-tls
  rules:
    - host: jenkins.radpro.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jenkins-service
                port:
                  number: 8080
