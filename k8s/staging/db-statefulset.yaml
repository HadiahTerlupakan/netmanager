apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-netmanager
  namespace: netmanager-staging
spec:
  serviceName: "db-netmanager"
  replicas: 1
  selector:
    matchLabels:
      app: db-netmanager
  template:
    metadata:
      labels:
        app: db-netmanager
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: "netmgr"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "netmanager"
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "netmgr", "-d", "netmanager"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "netmgr", "-d", "netmanager"]
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: db-netmanager
  namespace: netmanager-staging
spec:
  ports:
    - port: 5432
  selector:
    app: db-netmanager
---
