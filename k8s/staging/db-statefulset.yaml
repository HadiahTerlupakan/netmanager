apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: netmanager-db
  namespace: netmanager-staging
spec:
  serviceName: "db"
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: "netmgr"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "netmanager"
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: netmanager-staging
spec:
  ports:
    - port: 5432
  selector:
    app: db
