apiVersion: apps/v1
kind: Deployment
metadata:
  name: netmanager-cron
  namespace: netmanager-staging
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: netmanager-cron
  template:
    metadata:
      labels:
        app: netmanager-cron
    spec:
      imagePullSecrets:
        - name: netmanager-staging-registry
      terminationGracePeriodSeconds: 60
      containers:
        - name: cron
          image: "{{CRON_IMAGE}}"
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_URL
              value: "http://netmanager-app"
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: CRON_SECRET
            - name: TZ
              value: "Asia/Jakarta"
          resources:
            requests:
              cpu: "75m"
              memory: "192Mi"
            limits:
              cpu: "375m"
              memory: "384Mi"
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "crond"]
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 3
