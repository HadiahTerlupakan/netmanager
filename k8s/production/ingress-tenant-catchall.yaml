apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: netmanager-tenant-catchall
  namespace: netmanager-production
spec:
  entryPoints:
    - websecure
  routes:
    # Sintaks Traefik v3 (k3s membawa 3.x): HostRegexp menerima regex biasa.
    # Bentuk v2 `{host:.+}` dibaca harfiah dan tidak pernah cocok.
    - match: HostRegexp(`^.+$`)
      kind: Rule
      priority: 1
      services:
        - name: netmanager-app
          port: 80
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: netmanager-tenant-catchall-http
  namespace: netmanager-production
spec:
  entryPoints:
    - web
  routes:
    # Sintaks Traefik v3 (k3s membawa 3.x): HostRegexp menerima regex biasa.
    # Bentuk v2 `{host:.+}` dibaca harfiah dan tidak pernah cocok.
    - match: HostRegexp(`^.+$`)
      kind: Rule
      priority: 1
      middlewares:
        - name: redirect-https
      services:
        - name: netmanager-app
          port: 80
