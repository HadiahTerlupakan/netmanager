apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: netmanager-tenant-catchall
  namespace: netmanager-production
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostRegexp(`{host:.+}`)
      kind: Rule
      priority: 1
      services:
        - name: netmanager-app
          port: 80
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: netmanager-tenant-catchall-http
  namespace: netmanager-production
spec:
  entryPoints:
    - web
  routes:
    - match: HostRegexp(`{host:.+}`)
      kind: Rule
      priority: 1
      middlewares:
        - name: redirect-to-https
      services:
        - name: netmanager-app
          port: 80
