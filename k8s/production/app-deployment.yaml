apiVersion: apps/v1
kind: Deployment
metadata:
  name: netmanager-app
  namespace: netmanager-production
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: netmanager-app
  template:
    metadata:
      labels:
        app: netmanager-app
      annotations:
        deploy.radpro.id/managed-by: "jenkins"
        deploy.radpro.id/image-ref: "{{APP_IMAGE}}"
    spec:
      imagePullSecrets:
        - name: netmanager-production-registry
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - netmanager-app
                topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 1001
      terminationGracePeriodSeconds: 30
      serviceAccountName: netmanager-app
      containers:
        - name: app
          image: "{{APP_IMAGE}}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: netmanager-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: DATABASE_URL
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: REDIS_PASSWORD
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: AUTH_SECRET
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: NEXTAUTH_SECRET
            - name: RADIUS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: RADIUS_DATABASE_URL
            - name: DATABASE_URL_BILLING
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: DATABASE_URL_BILLING
            - name: DATABASE_URL_MITRA
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: DATABASE_URL_MITRA
            - name: RADIUS_SECRET
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: RADIUS_SECRET
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: CRON_SECRET
            - name: ENABLE_INTERNAL_CRON
              value: "false"
            - name: ENABLE_EVENT_BUS_WORKERS
              value: "false"
            - name: OAUTH_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: OAUTH_ENCRYPTION_KEY
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: REDIS_URL
            - name: FIREBASE_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: netmanager-firebase-secrets
                  key: FIREBASE_PROJECT_ID
            - name: FIREBASE_CLIENT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: netmanager-firebase-secrets
                  key: FIREBASE_CLIENT_EMAIL
            - name: FIREBASE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: netmanager-firebase-secrets
                  key: FIREBASE_PRIVATE_KEY
            - name: FIREBASE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: netmanager-firebase-secrets
                  key: FIREBASE_DATABASE_URL
                  optional: true
            - name: APP_UPDATE_SIGNING_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: APP_UPDATE_SIGNING_KEY_ID
                  optional: true
            - name: APP_UPDATE_SIGNING_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: APP_UPDATE_SIGNING_PRIVATE_KEY
                  optional: true
            - name: APP_UPDATE_PUBLISH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: APP_UPDATE_PUBLISH_TOKEN
                  optional: true
            - name: MOBILE_MIN_NATIVE_VERSION_CODE
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: MOBILE_MIN_NATIVE_VERSION_CODE
                  optional: true
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: netmanager-config
                  key: ALLOWED_ORIGINS
            # RADIUS external ports (match NodePort values in radius-deployment.yaml)
            - name: RADIUS_AUTH_PORT
              value: "30812"
            - name: RADIUS_ACCT_PORT
              value: "30813"
          volumeMounts:
            - name: uploads-volume
              mountPath: /app/public/uploads
            - name: baileys-sessions-volume
              mountPath: /app/.baileys-sessions
          resources:
            requests:
              cpu: "250m"
              memory: "768Mi"
            limits:
              cpu: "1500m"
              memory: "3Gi"
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: uploads-volume
          persistentVolumeClaim:
            claimName: netmanager-uploads
        - name: baileys-sessions-volume
          persistentVolumeClaim:
            claimName: netmanager-baileys-sessions
---
apiVersion: v1
kind: Service
metadata:
  name: netmanager-app
  namespace: netmanager-production
spec:
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: netmanager-app
