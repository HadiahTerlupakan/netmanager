apiVersion: v1
kind: ServiceAccount
metadata:
  name: netmanager-app
  namespace: netmanager-production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-certificate-manager
  namespace: netmanager-production
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["create", "get", "list", "delete", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  # IngressRoute per domain kustom. Sertifikat yang diterbitkan cert-manager
  # hanya tersimpan sebagai Secret; Traefik baru menyajikannya bila ada route
  # yang merujuk Secret itu. Tanpa aturan ini, domain tenant tetap dilayani
  # dengan sertifikat bawaan Traefik (self-signed).
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes"]
    verbs: ["create", "get", "list", "delete", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: netmanager-cert-manager-binding
  namespace: netmanager-production
subjects:
  - kind: ServiceAccount
    name: netmanager-app
    namespace: netmanager-production
roleRef:
  kind: Role
  name: cert-manager-certificate-manager
  apiGroup: rbac.authorization.k8s.io
