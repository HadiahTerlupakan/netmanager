apiVersion: apps/v1
kind: Deployment
metadata:
  name: netmanager-radius
  namespace: netmanager-production
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: netmanager-radius
  template:
    metadata:
      labels:
        app: netmanager-radius
      annotations:
        deploy.radpro.id/managed-by: "gitea"
        deploy.radpro.id/image-ref: "{{RADIUS_IMAGE}}"
    spec:
      imagePullSecrets:
        - name: netmanager-production-registry
      terminationGracePeriodSeconds: 30
      containers:
        - name: radius
          image: "{{RADIUS_IMAGE}}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1812
              protocol: UDP
            - containerPort: 1813
              protocol: UDP
          env:
            - name: DB_TYPE
              value: "postgresql"
            - name: DB_HOST
              value: "db-radius"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "radius"
            - name: DB_USER
              value: "netmgr"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: POSTGRES_PASSWORD
            - name: RADIUS_SECRET
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: RADIUS_SECRET
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep freeradius || exit 1"
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep freeradius || exit 1"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: netmanager-radius
  namespace: netmanager-production
spec:
  # Maintain client source IP address to identify individual NAS clients
  externalTrafficPolicy: Local
  type: NodePort
  ports:
    - name: radius-auth
      port: 1812
      targetPort: 1812
      nodePort: 30812
      protocol: UDP
    - name: radius-acct
      port: 1813
      targetPort: 1813
      nodePort: 30813
      protocol: UDP
  selector:
    app: netmanager-radius
