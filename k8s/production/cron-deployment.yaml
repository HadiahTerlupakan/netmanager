apiVersion: apps/v1
kind: Deployment
metadata:
  name: netmanager-cron
  namespace: netmanager-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netmanager-cron
  template:
    metadata:
      labels:
        app: netmanager-cron
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: cron
          image: netmanager-cron:production
          imagePullPolicy: Never
          env:
            - name: APP_URL
              value: "http://netmanager-app"
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: CRON_SECRET
            - name: TZ
              value: "Asia/Jakarta"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "node"]
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 3
