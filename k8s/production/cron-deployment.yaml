apiVersion: apps/v1
kind: Deployment
metadata:
  name: netmanager-cron
  namespace: netmanager-production
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: netmanager-cron
  template:
    metadata:
      labels:
        app: netmanager-cron
      annotations:
        deploy.radpro.id/managed-by: "gitea"
        deploy.radpro.id/image-ref: "{{CRON_IMAGE}}"
    spec:
      imagePullSecrets:
        - name: netmanager-production-registry
      terminationGracePeriodSeconds: 60
      containers:
        - name: cron
          image: "{{CRON_IMAGE}}"
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_URL
              value: "http://netmanager-app"
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: netmanager-secrets
                  key: CRON_SECRET
            - name: TZ
              value: "Asia/Jakarta"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "crond"]
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["sh", "-c", "pgrep -f crond > /dev/null && [ -s /etc/crontabs/root ]"]
            initialDelaySeconds: 5
            periodSeconds: 30
            failureThreshold: 3
