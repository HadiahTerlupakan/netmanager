# sqlippool definition for PostgreSQL with Multi-Tenant support
# Placeholder tokens (__XXX__) are substituted at container startup by docker-entrypoint.sh

sqlippool sqlippool {
    sql_module_instance = "sql"
    dialect = "postgresql"
    ippool_table = "radippool"
    lease_duration = 3600
    offer_duration = 60
    
    # We use control:Pool-Name because it's set in radgroupcheck via RadiusRepository
    pool_name = "%{control:Pool-Name}"
    
    allocated_address_attr = "Framed-IP-Address"
    owner = "%{Calling-Station-Id}"
    requested_address = "%{Framed-IP-Address}"
    gateway = "%{NAS-Identifier || NAS-IP-Address}"

    # PostgreSQL specific queries
    $INCLUDE ${modconfdir}/sql/ippool/postgresql/queries.conf

    # =========================================================================
    # CUSTOM QUERIES FOR MULTI-TENANCY
    # =========================================================================
    
    # Override allocate_find to filter by tenantId
    # The tenantId is resolved from the 'nas' table based on the requesting NAS IP
    allocate_find = "\
        SELECT framedipaddress FROM ${ippool_table} \
        WHERE pool_name = '%{control:Pool-Name}' \
        AND \"tenantId\" = (SELECT \"tenantId\" FROM nas WHERE nasname = '%{NAS-IP-Address}' LIMIT 1) \
        AND (expiry_time < NOW() OR expiry_time IS NULL) \
        ORDER BY \
            (username = '%{SQL-User-Name}'), \
            (callingstationid = '%{Calling-Station-Id}'), \
            expiry_time \
        LIMIT 1 \
        FOR UPDATE SKIP LOCKED"
        
    # Override allocate_update to include tenantId
    allocate_update = "\
        UPDATE ${ippool_table} \
        SET \
            nasipaddress = '%{NAS-IP-Address}', \
            pool_key = '${pool_key}', \
            callingstationid = '%{Calling-Station-Id}', \
            username = '%{SQL-User-Name}', \
            expiry_time = NOW() + INTERVAL '${lease_duration} seconds' \
        WHERE framedipaddress = '%I' \
        AND pool_name = '%{control:Pool-Name}' \
        AND \"tenantId\" = (SELECT \"tenantId\" FROM nas WHERE nasname = '%{NAS-IP-Address}' LIMIT 1)"

    # Override release_clear to include tenantId
    release_clear = "\
        UPDATE ${ippool_table} \
        SET \
            expiry_time = NOW() - INTERVAL '1 second' \
        WHERE framedipaddress = '%{Framed-IP-Address}' \
        AND pool_name = '%{control:Pool-Name}' \
        AND \"tenantId\" = (SELECT \"tenantId\" FROM nas WHERE nasname = '%{NAS-IP-Address}' LIMIT 1)"
}
