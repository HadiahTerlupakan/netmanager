# sqlippool configuration for PostgreSQL with Multi-Tenant support
# FreeRADIUS 3.2.5 compatible
# Placeholder tokens (__XXX__) are substituted at container startup by docker-entrypoint.sh

sqlippool {
	# SQL instance to use (from mods-available/sql)
	sql_module_instance = "sql"

	# Must match the dialect used in the sql module
	dialect = "postgresql"

	# Name of the check item attribute to be used as a key in the SQL queries
	pool_name = "Pool-Name"

	# SQL table to use for ippool range and lease info
	ippool_table = "radippool"

	# IP lease duration. (Leases expire even if Acct Stop packet is lost)
	lease_duration = 3600

	# Timeout between each consecutive 'allocate_clear' queries (default: 1s)
	allocate_clear_timeout = 1

	# The attribute to use for IP address assignment
	attribute_name = Framed-IP-Address

	# The attribute in which an IP address hint may be supplied
	req_attribute_name = Framed-IP-Address

	# Attribute which should be considered unique per NAS
	# Using NAS-Port gives behaviour similar to rlm_ippool (for PPPoE)
	pool_key = "%{NAS-Port}"

	# Status messages (added to control items as Module-Success-Message)
	messages {
		exists = "Existing IP: %{reply:${..attribute_name}} (did %{Called-Station-Id} cli %{Calling-Station-Id} port %{NAS-Port} user %{User-Name})"

		success = "Allocated IP: %{reply:${..attribute_name}} from %{control:${..pool_name}} (did %{Called-Station-Id} cli %{Calling-Station-Id} port %{NAS-Port} user %{User-Name})"

		clear = "Released IP %{request:${..attribute_name}} (did %{Called-Station-Id} cli %{Calling-Station-Id} user %{User-Name})"

		failed = "IP Allocation FAILED from %{control:${..pool_name}} (did %{Called-Station-Id} cli %{Calling-Station-Id} port %{NAS-Port} user %{User-Name})"

		nopool = "No ${..pool_name} defined (did %{Called-Station-Id} cli %{Calling-Station-Id} port %{NAS-Port} user %{User-Name})"
	}

	# Load default PostgreSQL queries first
	$INCLUDE ${modconfdir}/sql/ippool/${dialect}/queries.conf

	# =========================================================================
	# CUSTOM QUERY OVERRIDES FOR MULTI-TENANCY
	# These override the default queries loaded above
	# =========================================================================

	# Override allocate_existing: Try to re-assign same IP to returning client
	# Match by username OR callingstationid (MAC address) for sticky IP
	# NAS-Port changes between PPPoE sessions, so pool_key is NOT used here
	#
	# IMPORTANT: Using FOR UPDATE (without SKIP LOCKED) so the query WAITS
	# if stop_clear has a lock on the row, instead of skipping it.
	# This prevents race conditions during fast disconnect-reconnect.
	allocate_existing = "\
		WITH cte AS ( \
			SELECT framedipaddress FROM ${ippool_table} \
			WHERE pool_name = '%{control:${pool_name}}' \
			AND \"tenantId\" = (SELECT \"tenantId\" FROM nas WHERE nasname = '%{NAS-IP-Address}' LIMIT 1) \
			AND (username = '%{SQL-User-Name}' OR callingstationid = '%{Calling-Station-Id}') \
			ORDER BY \
				(username = '%{SQL-User-Name}') DESC, \
				expiry_time DESC \
			LIMIT 1 \
			FOR UPDATE \
		) \
		UPDATE ${ippool_table} \
		SET \
			nasipaddress = '%{NAS-IP-Address}', \
			pool_key = '${pool_key}', \
			callingstationid = '%{Calling-Station-Id}', \
			username = '%{SQL-User-Name}', \
			expiry_time = 'now'::timestamp(0) + '${lease_duration} second'::interval \
		FROM cte WHERE cte.framedipaddress = ${ippool_table}.framedipaddress \
		RETURNING cte.framedipaddress"

	# Override allocate_find: Find new available IP if no existing lease
	# Uses CTE with FOR UPDATE SKIP LOCKED for atomic operation (race-safe)
	allocate_find = "\
		WITH cte AS ( \
			SELECT framedipaddress FROM ${ippool_table} \
			WHERE pool_name = '%{control:${pool_name}}' \
			AND \"tenantId\" = (SELECT \"tenantId\" FROM nas WHERE nasname = '%{NAS-IP-Address}' LIMIT 1) \
			AND expiry_time < 'now'::timestamp(0) \
			ORDER BY expiry_time \
			LIMIT 1 \
			FOR UPDATE SKIP LOCKED \
		) \
		UPDATE ${ippool_table} \
		SET \
			nasipaddress = '%{NAS-IP-Address}', \
			pool_key = '${pool_key}', \
			callingstationid = '%{Calling-Station-Id}', \
			username = '%{SQL-User-Name}', \
			expiry_time = 'now'::timestamp(0) + '${lease_duration} second'::interval \
		FROM cte WHERE cte.framedipaddress = ${ippool_table}.framedipaddress \
		RETURNING cte.framedipaddress"

	# Override pool_check: Verify pool exists for this tenant
	pool_check = "\
		SELECT id FROM ${ippool_table} \
		WHERE pool_name = '%{control:${pool_name}}' \
		AND \"tenantId\" = (SELECT \"tenantId\" FROM nas WHERE nasname = '%{NAS-IP-Address}' LIMIT 1) \
		LIMIT 1"

	# Override start_update: Update lease on Accounting Start
	# NOTE: pool_key removed, match by username + framedipaddress instead
	start_update = "\
		UPDATE ${ippool_table} \
		SET \
			expiry_time = 'now'::timestamp(0) + '${lease_duration} second'::interval \
		WHERE nasipaddress = '%{NAS-IP-Address}' \
		AND username = '%{SQL-User-Name}' \
		AND framedipaddress = '%{${attribute_name}}' \
		AND \"tenantId\" = (SELECT \"tenantId\" FROM nas WHERE nasname = '%{NAS-IP-Address}' LIMIT 1)"

	# Override stop_clear: Release IP on Accounting Stop
	# NOTE: pool_key (NAS-Port) TIDAK digunakan di WHERE karena pada PPPoE,
	# NAS-Port bisa berubah. Match by username + MAC + IP sudah cukup unik.
	stop_clear = "\
		UPDATE ${ippool_table} \
		SET \
			expiry_time = 'now'::timestamp(0) - '1 second'::interval \
		WHERE nasipaddress = '%{%{Nas-IP-Address}:-%{Nas-IPv6-Address}}' \
		AND username = '%{SQL-User-Name}' \
		AND callingstationid = '%{Calling-Station-Id}' \
		AND framedipaddress = '%{${attribute_name}}' \
		AND \"tenantId\" = (SELECT \"tenantId\" FROM nas WHERE nasname = '%{NAS-IP-Address}' LIMIT 1)"

	# Override alive_update: Extend lease on Accounting Interim-Update
	# NOTE: pool_key removed, match by username + framedipaddress instead
	alive_update = "\
		UPDATE ${ippool_table} \
		SET \
			expiry_time = 'now'::timestamp(0) + '${lease_duration} seconds'::interval \
		WHERE nasipaddress = '%{%{Nas-IP-Address}:-%{Nas-IPv6-Address}}' \
		AND framedipaddress = '%{${attribute_name}}' \
		AND username = '%{SQL-User-Name}' \
		AND callingstationid = '%{Calling-Station-Id}' \
		AND \"tenantId\" = (SELECT \"tenantId\" FROM nas WHERE nasname = '%{NAS-IP-Address}' LIMIT 1)"

	# Override on_clear: Clear all leases when NAS comes online (CoA/DM)
	on_clear = "\
		UPDATE ${ippool_table} \
		SET \
			expiry_time = 'now'::timestamp(0) - '1 second'::interval \
		WHERE nasipaddress = '%{%{Nas-IP-Address}:-%{Nas-IPv6-Address}}' \
		AND \"tenantId\" = (SELECT \"tenantId\" FROM nas WHERE nasname = '%{NAS-IP-Address}' LIMIT 1)"

	# Override off_clear: Clear all leases when NAS goes offline
	off_clear = "\
		UPDATE ${ippool_table} \
		SET \
			expiry_time = 'now'::timestamp(0) - '1 second'::interval \
		WHERE nasipaddress = '%{%{Nas-IP-Address}:-%{Nas-IPv6-Address}}' \
		AND \"tenantId\" = (SELECT \"tenantId\" FROM nas WHERE nasname = '%{NAS-IP-Address}' LIMIT 1)"
}
