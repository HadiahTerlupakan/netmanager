# FreeRADIUS Clients Configuration
# This file defines which devices (NAS/MikroTik routers) can connect to RADIUS server

# Default client for testing
client localhost {
    ipaddr = 127.0.0.1
    secret = testing123
    shortname = localhost
    nas_type = other
}

# Template for MikroTik routers
# Uncomment and configure for each MikroTik router
# client mikrotik1 {
#     ipaddr = 192.168.1.1
#     secret = <SECRET_FROM_MIKROTIK_ROUTER_TABLE>
#     shortname = mikrotik1
#     nas_type = mikrotik
# }

# Allow connections from Docker network
client docker_network {
    ipaddr = 172.16.0.0/12
    secret = testing123
    shortname = docker
    nas_type = other
}

# Dynamic clients can be added via API
# See /api/admin/radius/clients for management
