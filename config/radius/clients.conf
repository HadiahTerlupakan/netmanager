# FreeRADIUS Clients Configuration
# ============================================================
# This file defines the FALLBACK clients for FreeRADIUS.
# 
# NOTE: Production NAS clients (MikroTik routers) are managed
# via the admin UI (/admin/network/mikrotik) and stored in the
# `nas` table in the radius database. FreeRADIUS reads them
# dynamically via `readclients = yes` in the SQL module.
# ============================================================

# Localhost - required for health checks and radclient testing
client localhost {
    ipaddr = 127.0.0.1
    secret = __RADIUS_SECRET__
    shortname = localhost
    nas_type = other
    require_message_authenticator = yes
}

# IPv6 localhost
client localhost_ipv6 {
    ipv6addr = ::1
    secret = __RADIUS_SECRET__
    shortname = localhost-v6
    nas_type = other
    require_message_authenticator = yes
}

# Kubernetes Pod Network (K3s default: 10.42.0.0/16)
# This allows any pod in the cluster to reach RADIUS for internal testing.
# In production, NAS authentication uses per-router secrets from the `nas` table.
client kubernetes_network {
    ipaddr = 10.42.0.0/16
    secret = __RADIUS_SECRET__
    shortname = k8s-internal
    nas_type = other
    require_message_authenticator = yes
}

# Docker Compose Network (for local development)
client docker_network {
    ipaddr = 172.16.0.0/12
    secret = __RADIUS_SECRET__
    shortname = docker
    nas_type = other
    require_message_authenticator = yes
}

# -----------------------------------------------------------------
# MASTER CLIENT - DYNAMIC IP (ANY IP)
# -----------------------------------------------------------------
# Seluruh MikroTik NAS akan menggunakan password seragam 
# sesuai dengan konfigurasi RADIUS_SECRET (Environment Variable).
# Membantu Zero-Touch Provisioning (Tidak butuh restart!)
# -----------------------------------------------------------------
client all_routers {
    ipaddr = 0.0.0.0/0
    secret = __RADIUS_SECRET__
    shortname = any-router
    nas_type = other
    require_message_authenticator = yes
    limit_proxy_state = yes
}
