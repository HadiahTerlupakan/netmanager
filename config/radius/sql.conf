# SQL Module Configuration for FreeRADIUS with PostgreSQL
sql {
    # Database driver
    driver = "rlm_sql_postgresql"
    
    # Database dialect
    dialect = "postgresql"
    
    # Connection info from environment variables
    server = "${ENV:DB_HOST}"
    port = ${ENV:DB_PORT}
    login = "${ENV:DB_USER}"
    password = "${ENV:DB_PASSWORD}"
    radius_db = "${ENV:DB_NAME}"
    
    # Connection pool settings
    pool {
        start = 5
        min = 4
        max = 20
        spare = 3
        uses = 0
        lifetime = 0
        idle_timeout = 60
        retry_delay = 1
        cleanup_interval = 30
    }
    
    # Read NAS clients from database
    # NAS entries are managed via the admin UI (/admin/network/mikrotik)
    # and stored in the `nas` table. This must be "yes" for dynamic NAS.
    read_clients = yes
    client_table = "nas"
    
    # Table names (standard FreeRADIUS schema)
    acct_table1 = "radacct"
    acct_table2 = "radacct"
    postauth_table = "radpostauth"
    authcheck_table = "radcheck"
    groupcheck_table = "radgroupcheck"
    authreply_table = "radreply"
    groupreply_table = "radgroupreply"
    usergroup_table = "radusergroup"
    
    # Column names for check/reply items
    authorize_check_query = "SELECT id, username, attribute, value, op FROM ${authcheck_table} WHERE username = '%{SQL-User-Name}' ORDER BY id"
    
    authorize_reply_query = "SELECT id, username, attribute, value, op FROM ${authreply_table} WHERE username = '%{SQL-User-Name}' ORDER BY id"
    
    authorize_group_check_query = "SELECT ${groupcheck_table}.id, ${groupcheck_table}.groupname, ${groupcheck_table}.attribute, ${groupcheck_table}.value, ${groupcheck_table}.op FROM ${groupcheck_table}, ${usergroup_table} WHERE ${usergroup_table}.username = '%{SQL-User-Name}' AND ${usergroup_table}.groupname = ${groupcheck_table}.groupname ORDER BY ${groupcheck_table}.id"
    
    authorize_group_reply_query = "SELECT ${groupreply_table}.id, ${groupreply_table}.groupname, ${groupreply_table}.attribute, ${groupreply_table}.value, ${groupreply_table}.op FROM ${groupreply_table}, ${usergroup_table} WHERE ${usergroup_table}.username = '%{SQL-User-Name}' AND ${usergroup_table}.groupname = ${groupreply_table}.groupname ORDER BY ${groupreply_table}.id"
    
    # Accounting queries
    accounting {
        reference = "%{tolower:type.%{Acct-Status-Type}.query}"
        
        type {
            accounting-on {
                query = "UPDATE ${....acct_table1} SET acctstoptime = TO_TIMESTAMP(%{integer:Event-Timestamp}), acctsessiontime = (EXTRACT(EPOCH FROM (TO_TIMESTAMP(%{integer:Event-Timestamp}) - acctstarttime)))::INTEGER, acctterminatecause = '%{Acct-Terminate-Cause}' WHERE acctstoptime IS NULL AND nasipaddress = '%{NAS-IP-Address}' AND acctstarttime <= TO_TIMESTAMP(%{integer:Event-Timestamp})"
            }
            
            accounting-off {
                query = "UPDATE ${....acct_table1} SET acctstoptime = TO_TIMESTAMP(%{integer:Event-Timestamp}), acctsessiontime = (EXTRACT(EPOCH FROM (TO_TIMESTAMP(%{integer:Event-Timestamp}) - acctstarttime)))::INTEGER, acctterminatecause = '%{Acct-Terminate-Cause}' WHERE acctstoptime IS NULL AND nasipaddress = '%{NAS-IP-Address}' AND acctstarttime <= TO_TIMESTAMP(%{integer:Event-Timestamp})"
            }
            
            start {
                query = "INSERT INTO ${....acct_table1} (acctsessionid, acctuniqueid, username, realm, nasipaddress, nasportid, nasporttype, acctstarttime, acctupdatetime, acctstoptime, acctsessiontime, acctauthentic, connectinfo_start, connectinfo_stop, acctinputoctets, acctoutputoctets, calledstationid, callingstationid, acctterminatecause, servicetype, framedprotocol, framedipaddress) VALUES ('%{Acct-Session-Id}', '%{Acct-Unique-Session-Id}', '%{SQL-User-Name}', '%{Realm}', '%{NAS-IP-Address}', '%{%{NAS-Port-ID}:-%{NAS-Port}}', '%{NAS-Port-Type}', TO_TIMESTAMP(%{integer:Event-Timestamp}), TO_TIMESTAMP(%{integer:Event-Timestamp}), NULL, 0, '%{Acct-Authentic}', '%{Connect-Info}', '', 0, 0, '%{Called-Station-Id}', '%{Calling-Station-Id}', '', '%{Service-Type}', '%{Framed-Protocol}', NULLIF('%{Framed-IP-Address}', '')::inet)"
            }
            
            interim-update {
                query = "UPDATE ${....acct_table1} SET acctupdatetime = TO_TIMESTAMP(%{integer:Event-Timestamp}), acctsessiontime = %{%{Acct-Session-Time}:-NULL}, acctinputoctets = (('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Input-Octets}:-0}'::bigint), acctoutputoctets = (('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Output-Octets}:-0}'::bigint) WHERE acctuniqueid = '%{Acct-Unique-Session-Id}'"
            }
            
            stop {
                query = "UPDATE ${....acct_table1} SET acctstoptime = TO_TIMESTAMP(%{integer:Event-Timestamp}), acctsessiontime = COALESCE(%{%{Acct-Session-Time}:-NULL}, (EXTRACT(EPOCH FROM (TO_TIMESTAMP(%{integer:Event-Timestamp}) - acctstarttime)))::INTEGER), acctinputoctets = (('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Input-Octets}:-0}'::bigint), acctoutputoctets = (('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Output-Octets}:-0}'::bigint), acctterminatecause = '%{Acct-Terminate-Cause}', connectinfo_stop = '%{Connect-Info}' WHERE acctuniqueid = '%{Acct-Unique-Session-Id}'"
            }
        }
    }
    
    # Post-Auth query (optional, for logging)
    post-auth {
        query = "INSERT INTO ${..postauth_table} (username, pass, reply, authdate) VALUES ('%{SQL-User-Name}', '%{%{User-Password}:-%{Chap-Password}}', '%{reply:Packet-Type}', NOW())"
    }
}
