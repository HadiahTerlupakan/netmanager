# SQL Module Configuration for FreeRADIUS 3.x with PostgreSQL
#
# Reference: https://networkradius.com/doc/current/raddb/mods-available/sql.html
# Reference: https://freeradius.org/documentation/freeradius-server/3.2.9/tutorials/sql.html
#
# Placeholder tokens (__XXX__) are substituted at container startup
# by docker-entrypoint.sh with actual environment variable values.
#
sql {
    # Database driver - must match installed rlm_sql_* module
    driver = "rlm_sql_postgresql"

    # Database dialect - determines which queries.conf to use
    dialect = "postgresql"

    # Connection info (substituted at runtime by docker-entrypoint.sh)
    server = "__DB_HOST__"
    port = __DB_PORT__
    login = "__DB_USER__"
    password = "__DB_PASSWORD__"
    radius_db = "__DB_NAME__"

    # Connection pool settings
    pool {
        start = 5
        min = 4
        max = 20
        spare = 3
        uses = 0
        lifetime = 0
        idle_timeout = 60
        retry_delay = 1
        cleanup_interval = 30
    }

    # Read NAS clients from the database (nas table).
    # NAS entries are managed via the admin UI (/admin/network/mikrotik)
    # NOTE: Clients are ONLY read on server startup, not live.
    read_clients = yes

    # Table names (standard FreeRADIUS PostgreSQL schema)
    acct_table1 = "radacct"
    acct_table2 = "radacct"
    postauth_table = "radpostauth"
    authcheck_table = "radcheck"
    groupcheck_table = "radgroupcheck"
    authreply_table = "radreply"
    groupreply_table = "radgroupreply"
    usergroup_table = "radusergroup"

    # NAS table for read_clients
    client_table = "nas"

    # Group attribute specific to this instance of rlm_sql
    group_attribute = "SQL-Group"

    # Remove stale sessions if checkrad does not see a double login
    delete_stale_sessions = yes

    # Read group membership
    read_groups = yes

    # ==========================================================================
    # MULTI-TENANT QUERY OVERRIDES
    # ==========================================================================
    # We filter all queries by tenantId, where tenantId is resolved from the
    # NAS (Router) that sent the request. This ensures that users with the
    # same name in different tenants do not conflict. The NAS is identified by
    # the packet's source address, which its secret was checked against, not
    # by NAS-IP-Address, which any router may set to another tenant's IP.
    # ==========================================================================

    # --- Authorization Queries ---
    
    authorize_check_query = "SELECT id, username, attribute, value, op \
      FROM ${authcheck_table} \
      WHERE username = '%{SQL-User-Name}' \
      AND \"tenantId\" = (SELECT \"tenantId\" FROM ${client_table} WHERE nasname = '%{Packet-Src-IP-Address}' LIMIT 1) \
      ORDER BY id"

    authorize_reply_query = "SELECT id, username, attribute, value, op \
      FROM ${authreply_table} \
      WHERE username = '%{SQL-User-Name}' \
      AND \"tenantId\" = (SELECT \"tenantId\" FROM ${client_table} WHERE nasname = '%{Packet-Src-IP-Address}' LIMIT 1) \
      ORDER BY id"

    group_membership_query = "SELECT groupname \
      FROM ${usergroup_table} \
      WHERE username = '%{SQL-User-Name}' \
      AND \"tenantId\" = (SELECT \"tenantId\" FROM ${client_table} WHERE nasname = '%{Packet-Src-IP-Address}' LIMIT 1) \
      ORDER BY priority"

    authorize_group_check_query = "SELECT id, groupname, attribute, value, op \
      FROM ${groupcheck_table} \
      WHERE groupname = '%{${group_attribute}}' \
      AND \"tenantId\" = (SELECT \"tenantId\" FROM ${client_table} WHERE nasname = '%{Packet-Src-IP-Address}' LIMIT 1) \
      ORDER BY id"

    authorize_group_reply_query = "SELECT id, groupname, attribute, value, op \
      FROM ${groupreply_table} \
      WHERE groupname = '%{${group_attribute}}' \
      AND \"tenantId\" = (SELECT \"tenantId\" FROM ${client_table} WHERE nasname = '%{Packet-Src-IP-Address}' LIMIT 1) \
      ORDER BY id"

    # The stock queries supply accounting and post-auth. FreeRADIUS keeps the
    # first definition of a name, so this include must stay below the
    # overrides above or they are silently ignored. Accounting has no tenant
    # filter of its own: trg_radacct_set_tenantid fills radacct."tenantId".
    $INCLUDE ${modconfdir}/sql/main/${dialect}/queries.conf
}
