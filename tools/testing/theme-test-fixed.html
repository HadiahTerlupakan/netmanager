<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Detection Test - Fixed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Import the same CSS variables from globals.css */
        :root {
            --color-bg-primary: 15 15 30;
            --color-bg-surface: 26 26 46;
            --color-bg-surface-variant: 22 33 62;
            --color-text-primary: 255 255 255;
            --color-text-secondary: 255 255 255;
            --color-text-tertiary: 255 255 255 / 0.7;
            --color-text-placeholder: 255 255 255 / 0.5;
            --color-border: 255 255 255 / 0.1;
            --color-primary: 79 70 229;
            --color-primary-variant: 99 102 241;
            --color-secondary: 6 182 212;
            --color-accent: 245 158 11;
        }

        /* Light Theme */
        .light {
            color-scheme: light;
            --color-bg-primary: 248 250 252;
            --color-bg-surface: 255 255 255;
            --color-bg-surface-variant: 241 245 249;
            --color-text-primary: 15 23 42;
            --color-text-secondary: 30 41 59;
            --color-text-tertiary: 71 85 105;
            --color-text-placeholder: 148 163 184;
            --color-border: 226 232 240;
            --shadow-neumorphic-raised: 8px 8px 16px rgba(0, 0, 0, 0.08), -8px -8px 16px rgba(255, 255, 255, 0.95);
            --shadow-neumorphic-inset: inset 8px 8px 16px rgba(0, 0, 0, 0.08), inset -8px -8px 16px rgba(255, 255, 255, 0.95);
            --shadow-neumorphic-soft: 4px 4px 8px rgba(0, 0, 0, 0.06), -4px -4px 8px rgba(255, 255, 255, 0.95);
            --shadow-neumorphic-hover: 12px 12px 24px rgba(0, 0, 0, 0.12), -12px -12px 24px rgba(255, 255, 255, 0.95);
        }

        /* Dark Theme */
        .dark {
            color-scheme: dark;
            --color-bg-primary: 15 15 30;
            --color-bg-surface: 26 26 46;
            --color-bg-surface-variant: 22 33 62;
            --color-text-primary: 255 255 255;
            --color-text-secondary: 255 255 255;
            --color-text-tertiary: 255 255 255 / 0.7;
            --color-text-placeholder: 255 255 255 / 0.5;
            --color-border: 255 255 255 / 0.1;
        }

        body {
            background-color: rgb(var(--color-bg-primary));
            color: rgb(var(--color-text-primary));
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .neumorphic {
            background: rgb(var(--color-bg-surface));
            box-shadow: var(--shadow-neumorphic-raised);
            border-radius: 16px;
            padding: 24px;
            margin: 20px;
            transition: all 0.3s ease;
        }

        .btn {
            background: rgb(var(--color-bg-surface));
            box-shadow: var(--shadow-neumorphic-raised);
            color: rgb(var(--color-primary));
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            box-shadow: var(--shadow-neumorphic-hover);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, rgb(var(--color-primary)) 0%, rgb(var(--color-primary-variant)) 100%);
            color: white;
        }
    </style>
</head>
<body>
    <div class="min-h-screen p-8">
        <div class="max-w-md mx-auto">
            <h1 class="text-2xl font-bold mb-4">Theme Detection Test - Fixed</h1>
            
            <div class="neumorphic">
                <p class="mb-4">This test verifies that theme detection is working correctly.</p>
                <p class="mb-4">Current theme class: <span id="current-theme" class="font-mono bg-gray-200 dark:bg-gray-700 px-2 py-1 rounded"></span></p>
                <p class="mb-4">System prefers: <span id="system-prefers" class="font-mono bg-gray-200 dark:bg-gray-700 px-2 py-1 rounded"></span></p>
                
                <div class="flex gap-4 mb-4">
                    <button id="light-btn" class="btn">Light Theme</button>
                    <button id="dark-btn" class="btn">Dark Theme</button>
                    <button id="auto-btn" class="btn btn-primary">Auto (System)</button>
                </div>
                
                <div class="text-sm opacity-70">
                    <p>✅ Browser dark mode should show dark theme</p>
                    <p>✅ Browser light mode should show light theme</p>
                    <p>✅ Manual theme switching should work instantly</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Theme detection and switching logic
        const html = document.documentElement;
        const currentThemeSpan = document.getElementById('current-theme');
        const systemPrefersSpan = document.getElementById('system-prefers');
        
        function updateThemeDisplay() {
            currentThemeSpan.textContent = html.className;
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            systemPrefersSpan.textContent = systemPrefersDark ? 'dark' : 'light';
        }
        
        function setTheme(theme) {
            html.className = theme;
            updateThemeDisplay();
        }
        
        function setAutoTheme() {
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            setTheme(systemPrefersDark ? 'dark' : 'light');
        }
        
        // Event listeners
        document.getElementById('light-btn').addEventListener('click', () => setTheme('light'));
        document.getElementById('dark-btn').addEventListener('click', () => setTheme('dark'));
        document.getElementById('auto-btn').addEventListener('click', setAutoTheme);
        
        // Listen for system theme changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', setAutoTheme);
        
        // Initialize
        setAutoTheme();
        updateThemeDisplay();
    </script>
</body>
</html>
