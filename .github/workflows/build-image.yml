name: Quality, Build & Deploy

# Seluruh CI/CD netmanager: gitleaks, lint, typecheck, tes 4 shard, build image
# ke GHCR, lalu deploy ke produksi. Menggantikan pipeline Gitea (dimatikan
# 2026-09-25) dan Jenkins sebelumnya. Build tidak pernah berjalan di host
# produksi: build Next.js pernah menembus 21 GB dan menjatuhkan seluruh host.
#
# Deploy memakai kunci SSH yang di host produksi dikunci ke satu perintah
# (`command="/usr/local/bin/netmanager-deploy",restrict`, sumbernya
# `scripts/deploy/netmanager-deploy.sh`). Workflow hanya mengirim SHA commit;
# skrip di host sendiri yang memverifikasi commit ada di `main`, menurunkan tag
# image, dan mengambil manifes dari commit itu. Kunci yang bocor karenanya tidak
# memberi shell, kubectl bebas, atau jalan menerapkan manifes kiriman sendiri.
#
# Tag image: `<12 karakter commit>-<epoch commit>`, dihitung ulang oleh skrip
# deploy dari commit yang sama.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "tasks/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: hadiahterlupakan

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # Riwayat penuh dibutuhkan gitleaks untuk memindai rentang push.
          fetch-depth: 0

      # Riwayat repo ini pernah memuat GitHub PAT (.mcp.json) dan service
      # account Firebase. Yang dipindai hanya commit yang baru didorong, supaya
      # temuan lama yang sudah dicabut tidak memblokir setiap run.
      - name: Pindai secret pada commit yang didorong
        env:
          SEBELUM: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${SEBELUM:-}" ] || ! git cat-file -e "${SEBELUM}^{commit}" 2>/dev/null; then
            RENTANG="-1 ${GITHUB_SHA}"
          else
            RENTANG="${SEBELUM}..${GITHUB_SHA}"
          fi
          echo "Rentang pindai: ${RENTANG}"
          docker run --rm -v "${PWD}:/repo" -w /repo zricethezav/gitleaks:v8.28.0 \
            git /repo --no-banner --redact --log-opts="${RENTANG}"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pasang dependensi
        env:
          # Prisma butuh URL berbentuk sah saat generate, bukan koneksi nyata.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          RADIUS_DATABASE_URL: postgresql://user:pass@localhost:5432/radius
          DATABASE_URL_BILLING: postgresql://user:pass@localhost:5432/billing
          DATABASE_URL_MITRA: postgresql://user:pass@localhost:5432/mitra
          PRISMA_HIDE_UPDATE_MESSAGE: "true"
        run: |
          set -euo pipefail
          npm ci --no-audit --prefer-offline --ignore-scripts
          npm run prisma:generate

      - name: Lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run lint

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run typecheck

  # Tes dipecah ke beberapa runner paralel. Waktu tes didominasi biaya memuat
  # modul per berkas (5.428 tes hanya ±83 detik eksekusi, sisanya import), jadi
  # menambah worker di satu mesin tidak banyak membantu — membagi berkas ke
  # beberapa mesin yang membantu.
  tes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pasang dependensi
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          RADIUS_DATABASE_URL: postgresql://user:pass@localhost:5432/radius
          DATABASE_URL_BILLING: postgresql://user:pass@localhost:5432/billing
          DATABASE_URL_MITRA: postgresql://user:pass@localhost:5432/mitra
          PRISMA_HIDE_UPDATE_MESSAGE: "true"
        run: |
          set -euo pipefail
          npm ci --no-audit --prefer-offline --ignore-scripts
          npm run prisma:generate

      - name: Tes unit (shard ${{ matrix.shard }}/4)
        env:
          NODE_ENV: test
          NODE_OPTIONS: --max-old-space-size=4096
          NEXTAUTH_SECRET: ci-build-dummy-secret-at-least-32-chars
          AUTH_SECRET: ci-build-dummy-secret-at-least-32-chars
          NEXTAUTH_URL: http://localhost:3000
          ENABLE_INTERNAL_CRON: "false"
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          RADIUS_DATABASE_URL: postgresql://user:pass@localhost:5432/radius
          DATABASE_URL_BILLING: postgresql://user:pass@localhost:5432/billing
          DATABASE_URL_MITRA: postgresql://user:pass@localhost:5432/mitra
          REDIS_URL: redis://localhost:6379
        run: npx vitest run --maxWorkers=4 --shard=${{ matrix.shard }}/4

  build:
    needs: [quality, tes]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Susun tag image
        id: tag
        run: |
          set -euo pipefail
          VERSION="$(echo "${GITHUB_SHA}" | cut -c1-12)-$(git show -s --format=%ct HEAD)"
          BASE="${REGISTRY}/${IMAGE_NAMESPACE}"
          {
            echo "version=${VERSION}"
            echo "app_image=${BASE}/netmanager-app:${VERSION}"
            echo "cron_image=${BASE}/netmanager-cron:${VERSION}"
            echo "radius_image=${BASE}/netmanager-radius:${VERSION}"
          } >> "$GITHUB_OUTPUT"
          echo "Tag image: ${VERSION}"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Runner repo publik 4 vCPU / 16 GB. Heap 3 GB terbukti kehabisan memori
      # (run 36075122236); 2 worker dengan heap 6 GB sama dengan konfigurasi yang
      # berjalan di VPS Gitea.
      #
      # Secret auth hanya dummy: build memvalidasi keberadaannya, nilai
      # sungguhan disuntik saat runtime lewat secret Kubernetes. NEXT_PUBLIC_*
      # tertanam di JavaScript yang dikirim ke browser, jadi disimpan sebagai
      # repository variables, bukan secrets.
      - name: Bangun & dorong image aplikasi
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.app_image }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=netmanager-app
          cache-to: type=gha,scope=netmanager-app,mode=max
          secrets: |
            NEXTAUTH_SECRET=ci-build-dummy-secret-at-least-32-chars
            AUTH_SECRET=ci-build-dummy-secret-at-least-32-chars
            OAUTH_ENCRYPTION_KEY=ci-build-dummy-secret-at-least-32-chars
          build-args: |
            IMAGE_REVISION=${{ github.sha }}
            NEXT_BUILD_CPUS=2
            NEXT_BUILD_FLAGS=--webpack
            NODE_OPTIONS=--no-deprecation --max-old-space-size=6144
            SKIP_TS_CHECK=true
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_DATABASE_URL=${{ vars.NEXT_PUBLIC_FIREBASE_DATABASE_URL }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}

      - name: Bangun & dorong image cron
        uses: docker/build-push-action@v7
        with:
          context: ./cron
          push: true
          tags: ${{ steps.tag.outputs.cron_image }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=netmanager-cron
          cache-to: type=gha,scope=netmanager-cron,mode=max

      - name: Bangun & dorong image radius
        uses: docker/build-push-action@v7
        with:
          context: .
          file: radius/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.radius_image }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=netmanager-radius
          cache-to: type=gha,scope=netmanager-radius,mode=max

  # Satu deploy dalam satu waktu; push beruntun mengantre, tidak dibatalkan.
  # Environment `production` hanya bisa dipakai dari cabang main dan menyimpan
  # satu-satunya secret sensitif di workflow ini (DEPLOY_SSH_KEY).
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    # Di atas waktu terburuk skrip: tunggu migrasi 3900 dtk + rollout 4x420 dtk
    # + cadangan. Kalaupun job diputus, skrip di host tetap berjalan sampai
    # selesai (lihat bagian "terlepas" di netmanager-deploy.sh).
    timeout-minutes: 150
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy ke produksi
        env:
          KUNCI_DEPLOY: ${{ secrets.DEPLOY_SSH_KEY }}
          TARGET_DEPLOY: ${{ vars.DEPLOY_SSH_TARGET }}
          # Host key disematkan: StrictHostKeyChecking=no menerima host palsu.
          KNOWN_HOSTS_DEPLOY: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${KUNCI_DEPLOY}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "${KNOWN_HOSTS_DEPLOY}" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "${TARGET_DEPLOY}" "${GITHUB_SHA}"

      - name: Hapus kunci SSH
        if: always()
        run: rm -f ~/.ssh/deploy
